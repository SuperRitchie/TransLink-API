
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28131866455078, "lng": -123.02576446533203, "route": "37807", "vehicle": 9766, "direction": "Outbound", "color": "red", "info": "Vehicle: 9766, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.03203582763672, "route": "37807", "vehicle": 23012, "direction": "Outbound", "color": "green", "info": "Vehicle: 23012, Route: 37807, Direction: Outbound"}, {"lat": 49.28031539916992, "lng": -122.97398376464844, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28141784667969, "lng": -123.10369873046875, "route": "37807", "vehicle": 24015, "direction": "Outbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.05691528320312, "route": "37807", "vehicle": 9717, "direction": "Outbound", "color": "red", "info": "Vehicle: 9717, Route: 37807, Direction: Outbound"}, {"lat": 49.28123474121094, "lng": -123.03092956542969, "route": "37807", "vehicle": 19018, "direction": "Inbound", "color": "green", "info": "Vehicle: 19018, Route: 37807, Direction: Inbound"}, {"lat": 49.27854919433594, "lng": -122.91238403320312, "route": "37807", "vehicle": 19040, "direction": "Inbound", "color": "green", "info": "Vehicle: 19040, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 19024, "direction": "Inbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Inbound"}, {"lat": 49.280418395996094, "lng": -122.96604919433594, "route": "37807", "vehicle": 24011, "direction": "Inbound", "color": "green", "info": "Vehicle: 24011, Route: 37807, Direction: Inbound"}, {"lat": 49.28245162963867, "lng": -123.10928344726562, "route": "37807", "vehicle": 22005, "direction": "Inbound", "color": "green", "info": "Vehicle: 22005, Route: 37807, Direction: Inbound"}, {"lat": 49.28521728515625, "lng": -123.11896514892578, "route": "37807", "vehicle": 19012, "direction": "Inbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Inbound"}, {"lat": 49.286582946777344, "lng": -123.11878204345703, "route": "37807", "vehicle": 22003, "direction": "Outbound", "color": "green", "info": "Vehicle: 22003, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281514485677086, lng: -123.0301284790039 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

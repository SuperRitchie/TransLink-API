
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28139877319336, "lng": -123.0996322631836, "route": "37807", "vehicle": 19026, "direction": "Inbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.08161926269531, "route": "37807", "vehicle": 23007, "direction": "Inbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.04736328125, "route": "37807", "vehicle": 22009, "direction": "Outbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.04476928710938, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.0164794921875, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.280033111572266, "lng": -122.99109649658203, "route": "37807", "vehicle": 19010, "direction": "Outbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Outbound"}, {"lat": 49.2802848815918, "lng": -122.9796142578125, "route": "37807", "vehicle": 22005, "direction": "Outbound", "color": "green", "info": "Vehicle: 22005, Route: 37807, Direction: Outbound"}, {"lat": 49.27691650390625, "lng": -122.92569732666016, "route": "37807", "vehicle": 19014, "direction": "Outbound", "color": "green", "info": "Vehicle: 19014, Route: 37807, Direction: Outbound"}, {"lat": 49.279232025146484, "lng": -122.9120864868164, "route": "37807", "vehicle": 19029, "direction": "Outbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Outbound"}, {"lat": 49.281333923339844, "lng": -123.10331726074219, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.05778503417969, "route": "37807", "vehicle": 19021, "direction": "Outbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Outbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 22007, "direction": "Inbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Inbound"}, {"lat": 49.280418395996094, "lng": -122.96980285644531, "route": "37807", "vehicle": 19036, "direction": "Inbound", "color": "green", "info": "Vehicle: 19036, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.96886444091797, "route": "37807", "vehicle": 19038, "direction": "Inbound", "color": "green", "info": "Vehicle: 19038, Route: 37807, Direction: Inbound"}, {"lat": 49.285701751708984, "lng": -123.1153335571289, "route": "37807", "vehicle": 19024, "direction": "Inbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Inbound"}, {"lat": 49.2861328125, "lng": -123.11833190917969, "route": "37807", "vehicle": 19042, "direction": "Outbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Outbound"}, {"lat": 49.287017822265625, "lng": -123.11603546142578, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28134514303768, lng: -123.0270928775563 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

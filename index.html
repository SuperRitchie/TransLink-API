
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28131866455078, "lng": -123.07063293457031, "route": "37807", "vehicle": 24001, "direction": "Inbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.05937957763672, "route": "37807", "vehicle": 24004, "direction": "Inbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.0354995727539, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.28105163574219, "lng": -123.02446746826172, "route": "37807", "vehicle": 19034, "direction": "Outbound", "color": "green", "info": "Vehicle: 19034, Route: 37807, Direction: Outbound"}, {"lat": 49.28034973144531, "lng": -122.95808410644531, "route": "37807", "vehicle": 22002, "direction": "Outbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Outbound"}, {"lat": 49.27674865722656, "lng": -122.94474792480469, "route": "37807", "vehicle": 19043, "direction": "Outbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Outbound"}, {"lat": 49.273582458496094, "lng": -122.92594909667969, "route": "37807", "vehicle": 19046, "direction": "Outbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Outbound"}, {"lat": 49.27921676635742, "lng": -122.93333435058594, "route": "37807", "vehicle": 19012, "direction": "Inbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Inbound"}, {"lat": 49.2803840637207, "lng": -122.97560119628906, "route": "37807", "vehicle": 24011, "direction": "Inbound", "color": "green", "info": "Vehicle: 24011, Route: 37807, Direction: Inbound"}, {"lat": 49.281166076660156, "lng": -123.07051849365234, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.03230285644531, "route": "37807", "vehicle": 24003, "direction": "Inbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Inbound"}, {"lat": 49.277950286865234, "lng": -122.91020202636719, "route": "37807", "vehicle": 19030, "direction": "Inbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Inbound"}, {"lat": 49.27840042114258, "lng": -122.9124526977539, "route": "37807", "vehicle": 22004, "direction": "Inbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Inbound"}, {"lat": 49.28406524658203, "lng": -123.11193084716797, "route": "37807", "vehicle": 23007, "direction": "Outbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Outbound"}, {"lat": 49.28543472290039, "lng": -123.11566925048828, "route": "37807", "vehicle": 19040, "direction": "Inbound", "color": "green", "info": "Vehicle: 19040, Route: 37807, Direction: Inbound"}, {"lat": 49.285831451416016, "lng": -123.11485290527344, "route": "37807", "vehicle": 9635, "direction": "Inbound", "color": "red", "info": "Vehicle: 9635, Route: 37807, Direction: Inbound"}, {"lat": 49.28466796875, "lng": -123.1127700805664, "route": "37807", "vehicle": 9615, "direction": "Inbound", "color": "red", "info": "Vehicle: 9615, Route: 37807, Direction: Inbound"}, {"lat": 49.28596878051758, "lng": -123.11840057373047, "route": "37807", "vehicle": 19016, "direction": "Outbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Outbound"}, {"lat": 49.286033630371094, "lng": -123.11834716796875, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}, {"lat": 49.28123474121094, "lng": -123.09561920166016, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.0369644165039, "route": "37807", "vehicle": 24009, "direction": "Outbound", "color": "green", "info": "Vehicle: 24009, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281332651774086, lng: -123.0322727021717 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

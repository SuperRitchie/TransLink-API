
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28108215332031, "lng": -123.08418273925781, "route": "37807", "vehicle": 22011, "direction": "Inbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.0635986328125, "route": "37807", "vehicle": 24016, "direction": "Inbound", "color": "green", "info": "Vehicle: 24016, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.0555191040039, "route": "37807", "vehicle": 19035, "direction": "Outbound", "color": "green", "info": "Vehicle: 19035, Route: 37807, Direction: Outbound"}, {"lat": 49.280982971191406, "lng": -123.00479888916016, "route": "37807", "vehicle": 23007, "direction": "Outbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Outbound"}, {"lat": 49.28036880493164, "lng": -122.95621490478516, "route": "37807", "vehicle": 24004, "direction": "Outbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Outbound"}, {"lat": 49.27360153198242, "lng": -122.92768096923828, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.28020095825195, "lng": -122.99141693115234, "route": "37807", "vehicle": 16219, "direction": "Inbound", "color": "red", "info": "Vehicle: 16219, Route: 37807, Direction: Inbound"}, {"lat": 49.28223419189453, "lng": -123.10883331298828, "route": "37807", "vehicle": 16218, "direction": "Outbound", "color": "red", "info": "Vehicle: 16218, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.07244873046875, "route": "37807", "vehicle": 19026, "direction": "Outbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Outbound"}, {"lat": 49.27976608276367, "lng": -122.92037963867188, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.278751373291016, "lng": -122.912353515625, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.28044891357422, "lng": -122.95832061767578, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.28459930419922, "lng": -123.1126480102539, "route": "37807", "vehicle": 24006, "direction": "Inbound", "color": "green", "info": "Vehicle: 24006, Route: 37807, Direction: Inbound"}, {"lat": 49.28601837158203, "lng": -123.1187515258789, "route": "37807", "vehicle": 16222, "direction": "Outbound", "color": "red", "info": "Vehicle: 16222, Route: 37807, Direction: Outbound"}, {"lat": 49.286033630371094, "lng": -123.11858367919922, "route": "37807", "vehicle": 24015, "direction": "Outbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.01581573486328, "route": "37807", "vehicle": 16203, "direction": "Inbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28116798400879, lng: -123.0263466835022 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

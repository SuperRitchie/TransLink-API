
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281982421875, "lng": -123.10694885253906, "route": "37807", "vehicle": 9619, "direction": "Inbound", "color": "red", "info": "Vehicle: 9619, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.08080291748047, "route": "37807", "vehicle": 8144, "direction": "Inbound", "color": "red", "info": "Vehicle: 8144, Route: 37807, Direction: Inbound"}, {"lat": 49.28131866455078, "lng": -123.071533203125, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.0558853149414, "route": "37807", "vehicle": 21025, "direction": "Outbound", "color": "green", "info": "Vehicle: 21025, Route: 37807, Direction: Outbound"}, {"lat": 49.280948638916016, "lng": -123.01335144042969, "route": "37807", "vehicle": 19023, "direction": "Outbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Outbound"}, {"lat": 49.28026580810547, "lng": -122.97028350830078, "route": "37807", "vehicle": 19007, "direction": "Outbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Outbound"}, {"lat": 49.28033447265625, "lng": -122.91075134277344, "route": "37807", "vehicle": 24014, "direction": "Outbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Outbound"}, {"lat": 49.27996826171875, "lng": -122.92024993896484, "route": "37807", "vehicle": 19017, "direction": "Inbound", "color": "green", "info": "Vehicle: 19017, Route: 37807, Direction: Inbound"}, {"lat": 49.28023147583008, "lng": -122.99099731445312, "route": "37807", "vehicle": 24001, "direction": "Inbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Inbound"}, {"lat": 49.28223419189453, "lng": -123.10845184326172, "route": "37807", "vehicle": 19033, "direction": "Outbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Outbound"}, {"lat": 49.28125, "lng": -123.09805297851562, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.2811164855957, "lng": -123.05706787109375, "route": "37807", "vehicle": 19046, "direction": "Outbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.02535247802734, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 24008, "direction": "Inbound", "color": "green", "info": "Vehicle: 24008, Route: 37807, Direction: Inbound"}, {"lat": 49.27870178222656, "lng": -122.912353515625, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.2841682434082, "lng": -123.11731719970703, "route": "37807", "vehicle": 24009, "direction": "Inbound", "color": "green", "info": "Vehicle: 24009, Route: 37807, Direction: Inbound"}, {"lat": 49.2859992980957, "lng": -123.11951446533203, "route": "37807", "vehicle": 22004, "direction": "Inbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Inbound"}, {"lat": 49.28561782836914, "lng": -123.11907958984375, "route": "37807", "vehicle": 16203, "direction": "Inbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Inbound"}, {"lat": 49.28693389892578, "lng": -123.11724853515625, "route": "37807", "vehicle": 19015, "direction": "Outbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.04524993896484, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28170528411865, lng: -123.03766212463378 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

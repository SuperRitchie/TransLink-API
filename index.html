
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28126525878906, "lng": -123.09426879882812, "route": "37807", "vehicle": 22012, "direction": "Inbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.02493286132812, "route": "37807", "vehicle": 19045, "direction": "Outbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Outbound"}, {"lat": 49.28033447265625, "lng": -122.98421478271484, "route": "37807", "vehicle": 19026, "direction": "Outbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Outbound"}, {"lat": 49.27914810180664, "lng": -122.94886779785156, "route": "37807", "vehicle": 22015, "direction": "Outbound", "color": "green", "info": "Vehicle: 22015, Route: 37807, Direction: Outbound"}, {"lat": 49.28084945678711, "lng": -122.92316436767578, "route": "37807", "vehicle": 19031, "direction": "Inbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Inbound"}, {"lat": 49.280967712402344, "lng": -123.08061981201172, "route": "37807", "vehicle": 19015, "direction": "Outbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.0602798461914, "route": "37807", "vehicle": 22014, "direction": "Outbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.02694702148438, "route": "37807", "vehicle": 9799, "direction": "Inbound", "color": "red", "info": "Vehicle: 9799, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 19006, "direction": "Inbound", "color": "green", "info": "Vehicle: 19006, Route: 37807, Direction: Inbound"}, {"lat": 49.27858352661133, "lng": -122.91236877441406, "route": "37807", "vehicle": 19033, "direction": "Inbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Inbound"}, {"lat": 49.28030014038086, "lng": -122.96192932128906, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.28506851196289, "lng": -123.11898040771484, "route": "37807", "vehicle": 19034, "direction": "Inbound", "color": "green", "info": "Vehicle: 19034, Route: 37807, Direction: Inbound"}, {"lat": 49.286415100097656, "lng": -123.11896514892578, "route": "37807", "vehicle": 9633, "direction": "Inbound", "color": "red", "info": "Vehicle: 9633, Route: 37807, Direction: Inbound"}, {"lat": 49.28578186035156, "lng": -123.11903381347656, "route": "37807", "vehicle": 19037, "direction": "Inbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Inbound"}, {"lat": 49.286399841308594, "lng": -123.11756896972656, "route": "37807", "vehicle": 19013, "direction": "Outbound", "color": "green", "info": "Vehicle: 19013, Route: 37807, Direction: Outbound"}, {"lat": 49.286048889160156, "lng": -123.11846923828125, "route": "37807", "vehicle": 19021, "direction": "Outbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.01367950439453, "route": "37807", "vehicle": 19012, "direction": "Inbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.04900360107422, "route": "37807", "vehicle": 19047, "direction": "Inbound", "color": "green", "info": "Vehicle: 19047, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28196822272407, lng: -123.03255801730685 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

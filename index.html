
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28143310546875, "lng": -123.1024169921875, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.09071350097656, "route": "37807", "vehicle": 18060, "direction": "Inbound", "color": "green", "info": "Vehicle: 18060, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.031982421875, "route": "37807", "vehicle": 19047, "direction": "Outbound", "color": "green", "info": "Vehicle: 19047, Route: 37807, Direction: Outbound"}, {"lat": 49.280948638916016, "lng": -123.00406646728516, "route": "37807", "vehicle": 19036, "direction": "Outbound", "color": "green", "info": "Vehicle: 19036, Route: 37807, Direction: Outbound"}, {"lat": 49.27668380737305, "lng": -122.94473266601562, "route": "37807", "vehicle": 19008, "direction": "Outbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Outbound"}, {"lat": 49.27898406982422, "lng": -122.92037963867188, "route": "37807", "vehicle": 19031, "direction": "Outbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Outbound"}, {"lat": 49.28139877319336, "lng": -123.1021499633789, "route": "37807", "vehicle": 19018, "direction": "Outbound", "color": "green", "info": "Vehicle: 19018, Route: 37807, Direction: Outbound"}, {"lat": 49.28223419189453, "lng": -123.10859680175781, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}, {"lat": 49.2814826965332, "lng": -123.10355377197266, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.05851745605469, "route": "37807", "vehicle": 22002, "direction": "Outbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Outbound"}, {"lat": 49.27841567993164, "lng": -122.9124526977539, "route": "37807", "vehicle": 19007, "direction": "Inbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Inbound"}, {"lat": 49.279632568359375, "lng": -122.92057037353516, "route": "37807", "vehicle": 19027, "direction": "Inbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Inbound"}, {"lat": 49.27861785888672, "lng": -122.91236877441406, "route": "37807", "vehicle": 22001, "direction": "Inbound", "color": "green", "info": "Vehicle: 22001, Route: 37807, Direction: Inbound"}, {"lat": 49.28044891357422, "lng": -122.95439910888672, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.28538131713867, "lng": -123.11399841308594, "route": "37807", "vehicle": 22004, "direction": "Inbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Inbound"}, {"lat": 49.28200149536133, "lng": -123.10710144042969, "route": "37807", "vehicle": 19013, "direction": "Inbound", "color": "green", "info": "Vehicle: 19013, Route: 37807, Direction: Inbound"}, {"lat": 49.2823486328125, "lng": -123.10900115966797, "route": "37807", "vehicle": 22015, "direction": "Inbound", "color": "green", "info": "Vehicle: 22015, Route: 37807, Direction: Inbound"}, {"lat": 49.286800384521484, "lng": -123.11644744873047, "route": "37807", "vehicle": 24001, "direction": "Outbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Outbound"}, {"lat": 49.286048889160156, "lng": -123.1183853149414, "route": "37807", "vehicle": 19042, "direction": "Outbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.0071029663086, "route": "37807", "vehicle": 22014, "direction": "Inbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Inbound"}, {"lat": 49.281166076660156, "lng": -123.02266693115234, "route": "37807", "vehicle": 24016, "direction": "Inbound", "color": "green", "info": "Vehicle: 24016, Route: 37807, Direction: Inbound"}, {"lat": 49.28120040893555, "lng": -123.04483032226562, "route": "37807", "vehicle": 24005, "direction": "Inbound", "color": "green", "info": "Vehicle: 24005, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.05558013916016, "route": "37807", "vehicle": 19026, "direction": "Inbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Inbound"}, {"lat": 49.28120040893555, "lng": -123.0512466430664, "route": "37807", "vehicle": 9624, "direction": "Inbound", "color": "red", "info": "Vehicle: 9624, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.05618286132812, "route": "37807", "vehicle": 9644, "direction": "Inbound", "color": "red", "info": "Vehicle: 9644, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28132827758789, lng: -123.03877777099609 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

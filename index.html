
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28126525878906, "lng": -123.09380340576172, "route": "37807", "vehicle": 19030, "direction": "Inbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Inbound"}, {"lat": 49.28126525878906, "lng": -123.09281921386719, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.04866790771484, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.03278350830078, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.28126525878906, "lng": -123.03250122070312, "route": "37807", "vehicle": 8146, "direction": "Inbound", "color": "red", "info": "Vehicle: 8146, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.02503204345703, "route": "37807", "vehicle": 23003, "direction": "Outbound", "color": "green", "info": "Vehicle: 23003, Route: 37807, Direction: Outbound"}, {"lat": 49.28099822998047, "lng": -123.01110076904297, "route": "37807", "vehicle": 19047, "direction": "Outbound", "color": "green", "info": "Vehicle: 19047, Route: 37807, Direction: Outbound"}, {"lat": 49.280967712402344, "lng": -123.00361633300781, "route": "37807", "vehicle": 23014, "direction": "Outbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Outbound"}, {"lat": 49.2776985168457, "lng": -122.94622039794922, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.07466888427734, "route": "37807", "vehicle": 21025, "direction": "Outbound", "color": "green", "info": "Vehicle: 21025, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.09832000732422, "route": "37807", "vehicle": 23008, "direction": "Outbound", "color": "green", "info": "Vehicle: 23008, Route: 37807, Direction: Outbound"}, {"lat": 49.281150817871094, "lng": -123.05863189697266, "route": "37807", "vehicle": 18060, "direction": "Outbound", "color": "green", "info": "Vehicle: 18060, Route: 37807, Direction: Outbound"}, {"lat": 49.28390121459961, "lng": -123.12014770507812, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.28441619873047, "lng": -123.12086486816406, "route": "37807", "vehicle": 22002, "direction": "Inbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Inbound"}, {"lat": 49.28535079956055, "lng": -123.11956787109375, "route": "37807", "vehicle": 23010, "direction": "Inbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Inbound"}, {"lat": 49.28594970703125, "lng": -123.11866760253906, "route": "37807", "vehicle": 19017, "direction": "Outbound", "color": "green", "info": "Vehicle: 19017, Route: 37807, Direction: Outbound"}, {"lat": 49.28533172607422, "lng": -123.1198501586914, "route": "37807", "vehicle": 23013, "direction": "Outbound", "color": "green", "info": "Vehicle: 23013, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.00572967529297, "route": "37807", "vehicle": 24009, "direction": "Inbound", "color": "green", "info": "Vehicle: 24009, Route: 37807, Direction: Inbound"}, {"lat": 49.281166076660156, "lng": -123.04376983642578, "route": "37807", "vehicle": 19007, "direction": "Inbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.05359649658203, "route": "37807", "vehicle": 23001, "direction": "Inbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28194694519043, lng: -123.0610179901123 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

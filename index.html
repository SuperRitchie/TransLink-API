
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28128433227539, "lng": -123.09296417236328, "route": "37807", "vehicle": 19040, "direction": "Inbound", "color": "green", "info": "Vehicle: 19040, Route: 37807, Direction: Inbound"}, {"lat": 49.28126525878906, "lng": -123.06950378417969, "route": "37807", "vehicle": 19016, "direction": "Inbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.02103424072266, "route": "37807", "vehicle": 19033, "direction": "Outbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Outbound"}, {"lat": 49.2810173034668, "lng": -123.0206527709961, "route": "37807", "vehicle": 8147, "direction": "Outbound", "color": "red", "info": "Vehicle: 8147, Route: 37807, Direction: Outbound"}, {"lat": 49.280250549316406, "lng": -122.98208618164062, "route": "37807", "vehicle": 19013, "direction": "Outbound", "color": "green", "info": "Vehicle: 19013, Route: 37807, Direction: Outbound"}, {"lat": 49.27658462524414, "lng": -122.93038177490234, "route": "37807", "vehicle": 8145, "direction": "Outbound", "color": "red", "info": "Vehicle: 8145, Route: 37807, Direction: Outbound"}, {"lat": 49.280033111572266, "lng": -122.9198989868164, "route": "37807", "vehicle": 19032, "direction": "Outbound", "color": "green", "info": "Vehicle: 19032, Route: 37807, Direction: Outbound"}, {"lat": 49.277584075927734, "lng": -122.93343353271484, "route": "37807", "vehicle": 19015, "direction": "Inbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.98069763183594, "route": "37807", "vehicle": 22010, "direction": "Inbound", "color": "green", "info": "Vehicle: 22010, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.00306701660156, "route": "37807", "vehicle": 22006, "direction": "Inbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Inbound"}, {"lat": 49.28093338012695, "lng": -123.08055114746094, "route": "37807", "vehicle": 19046, "direction": "Outbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.02811431884766, "route": "37807", "vehicle": 9782, "direction": "Inbound", "color": "red", "info": "Vehicle: 9782, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91276550292969, "route": "37807", "vehicle": 22015, "direction": "Inbound", "color": "green", "info": "Vehicle: 22015, Route: 37807, Direction: Inbound"}, {"lat": 49.27909851074219, "lng": -122.91107940673828, "route": "37807", "vehicle": 19025, "direction": "Inbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Inbound"}, {"lat": 49.282649993896484, "lng": -123.1098861694336, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28536605834961, "lng": -123.11351776123047, "route": "37807", "vehicle": 8151, "direction": "Inbound", "color": "red", "info": "Vehicle: 8151, Route: 37807, Direction: Inbound"}, {"lat": 49.286067962646484, "lng": -123.11856842041016, "route": "37807", "vehicle": 19024, "direction": "Outbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Outbound"}, {"lat": 49.285850524902344, "lng": -123.11876678466797, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}, {"lat": 49.28631591796875, "lng": -123.11830139160156, "route": "37807", "vehicle": 15018, "direction": "Outbound", "color": "red", "info": "Vehicle: 15018, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.04093170166016, "route": "37807", "vehicle": 9717, "direction": "Inbound", "color": "red", "info": "Vehicle: 9717, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.05196380615234, "route": "37807", "vehicle": 23006, "direction": "Inbound", "color": "green", "info": "Vehicle: 23006, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28137860979353, lng: -123.02657935732887 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

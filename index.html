
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2811164855957, "lng": -123.0494155883789, "route": "37807", "vehicle": 23001, "direction": "Outbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Outbound"}, {"lat": 49.28033447265625, "lng": -122.98806762695312, "route": "37807", "vehicle": 18042, "direction": "Outbound", "color": "green", "info": "Vehicle: 18042, Route: 37807, Direction: Outbound"}, {"lat": 49.28036880493164, "lng": -122.95783233642578, "route": "37807", "vehicle": 19043, "direction": "Outbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Outbound"}, {"lat": 49.28156661987305, "lng": -123.10448455810547, "route": "37807", "vehicle": 19023, "direction": "Outbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Outbound"}, {"lat": 49.27909851074219, "lng": -122.91133117675781, "route": "37807", "vehicle": 22002, "direction": "Inbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.95829772949219, "route": "37807", "vehicle": 23002, "direction": "Inbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Inbound"}, {"lat": 49.285884857177734, "lng": -123.1146011352539, "route": "37807", "vehicle": 24012, "direction": "Inbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Inbound"}, {"lat": 49.28671646118164, "lng": -123.11751556396484, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}, {"lat": 49.281150817871094, "lng": -123.02214813232422, "route": "37807", "vehicle": 22007, "direction": "Inbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281852298312714, lng: -123.02485487196181 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

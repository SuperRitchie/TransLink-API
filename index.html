
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281349182128906, "lng": -123.07113647460938, "route": "37807", "vehicle": 19007, "direction": "Inbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.05598449707031, "route": "37807", "vehicle": 24003, "direction": "Outbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.02556610107422, "route": "37807", "vehicle": 9755, "direction": "Outbound", "color": "red", "info": "Vehicle: 9755, Route: 37807, Direction: Outbound"}, {"lat": 49.28125, "lng": -123.03276824951172, "route": "37807", "vehicle": 16224, "direction": "Inbound", "color": "red", "info": "Vehicle: 16224, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.02503204345703, "route": "37807", "vehicle": 19045, "direction": "Outbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Outbound"}, {"lat": 49.28030014038086, "lng": -122.9726333618164, "route": "37807", "vehicle": 22002, "direction": "Outbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Outbound"}, {"lat": 49.2802848815918, "lng": -122.91069793701172, "route": "37807", "vehicle": 21025, "direction": "Outbound", "color": "green", "info": "Vehicle: 21025, Route: 37807, Direction: Outbound"}, {"lat": 49.282318115234375, "lng": -123.10855102539062, "route": "37807", "vehicle": 23006, "direction": "Outbound", "color": "green", "info": "Vehicle: 23006, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.02593231201172, "route": "37807", "vehicle": 19037, "direction": "Inbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Inbound"}, {"lat": 49.280418395996094, "lng": -122.95439910888672, "route": "37807", "vehicle": 19009, "direction": "Inbound", "color": "green", "info": "Vehicle: 19009, Route: 37807, Direction: Inbound"}, {"lat": 49.28441619873047, "lng": -123.11720275878906, "route": "37807", "vehicle": 19008, "direction": "Inbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Inbound"}, {"lat": 49.28200149536133, "lng": -123.10726928710938, "route": "37807", "vehicle": 24007, "direction": "Inbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Inbound"}, {"lat": 49.28533172607422, "lng": -123.117919921875, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.2866325378418, "lng": -123.11582946777344, "route": "37807", "vehicle": 24006, "direction": "Outbound", "color": "green", "info": "Vehicle: 24006, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28205517360142, lng: -123.04578018188477 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2813835144043, "lng": -123.09877014160156, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.2813835144043, "lng": -123.07634735107422, "route": "37807", "vehicle": 24006, "direction": "Inbound", "color": "green", "info": "Vehicle: 24006, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.04727935791016, "route": "37807", "vehicle": 16224, "direction": "Outbound", "color": "red", "info": "Vehicle: 16224, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.02539825439453, "route": "37807", "vehicle": 23006, "direction": "Outbound", "color": "green", "info": "Vehicle: 23006, Route: 37807, Direction: Outbound"}, {"lat": 49.280250549316406, "lng": -122.9925308227539, "route": "37807", "vehicle": 19010, "direction": "Outbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Outbound"}, {"lat": 49.280967712402344, "lng": -123.00271606445312, "route": "37807", "vehicle": 19045, "direction": "Outbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Outbound"}, {"lat": 49.28031539916992, "lng": -122.95263671875, "route": "37807", "vehicle": 22002, "direction": "Outbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Outbound"}, {"lat": 49.2803840637207, "lng": -122.97671508789062, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.28093338012695, "lng": -123.0810317993164, "route": "37807", "vehicle": 23003, "direction": "Outbound", "color": "green", "info": "Vehicle: 23003, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.09838104248047, "route": "37807", "vehicle": 24003, "direction": "Outbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.06220245361328, "route": "37807", "vehicle": 19034, "direction": "Outbound", "color": "green", "info": "Vehicle: 19034, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.0385513305664, "route": "37807", "vehicle": 19009, "direction": "Inbound", "color": "green", "info": "Vehicle: 19009, Route: 37807, Direction: Inbound"}, {"lat": 49.28533172607422, "lng": -123.114013671875, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.28591537475586, "lng": -123.11840057373047, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.05480194091797, "route": "37807", "vehicle": 24007, "direction": "Inbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.0456314086914, "route": "37807", "vehicle": 23001, "direction": "Outbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28155493736267, lng: -123.04908800125122 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

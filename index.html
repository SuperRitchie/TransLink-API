
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28129959106445, "lng": -123.0786361694336, "route": "37807", "vehicle": 23001, "direction": "Inbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.04671478271484, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.28376770019531, "lng": -123.03209686279297, "route": "37807", "vehicle": 22004, "direction": "Outbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Outbound"}, {"lat": 49.28125, "lng": -123.03278350830078, "route": "37807", "vehicle": 23015, "direction": "Inbound", "color": "green", "info": "Vehicle: 23015, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.01954650878906, "route": "37807", "vehicle": 22015, "direction": "Outbound", "color": "green", "info": "Vehicle: 22015, Route: 37807, Direction: Outbound"}, {"lat": 49.280067443847656, "lng": -122.91978454589844, "route": "37807", "vehicle": 24005, "direction": "Outbound", "color": "green", "info": "Vehicle: 24005, Route: 37807, Direction: Outbound"}, {"lat": 49.27410125732422, "lng": -122.93550109863281, "route": "37807", "vehicle": 19007, "direction": "Inbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Inbound"}, {"lat": 49.281166076660156, "lng": -123.09373474121094, "route": "37807", "vehicle": 8156, "direction": "Outbound", "color": "red", "info": "Vehicle: 8156, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.0253677368164, "route": "37807", "vehicle": 19020, "direction": "Inbound", "color": "green", "info": "Vehicle: 19020, Route: 37807, Direction: Inbound"}, {"lat": 49.278533935546875, "lng": -122.91273498535156, "route": "37807", "vehicle": 18032, "direction": "Inbound", "color": "green", "info": "Vehicle: 18032, Route: 37807, Direction: Inbound"}, {"lat": 49.28273391723633, "lng": -123.10994720458984, "route": "37807", "vehicle": 19037, "direction": "Outbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Outbound"}, {"lat": 49.28239822387695, "lng": -123.10929870605469, "route": "37807", "vehicle": 19024, "direction": "Inbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Inbound"}, {"lat": 49.28536605834961, "lng": -123.1195297241211, "route": "37807", "vehicle": 19033, "direction": "Inbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Inbound"}, {"lat": 49.28514862060547, "lng": -123.11609649658203, "route": "37807", "vehicle": 19021, "direction": "Inbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Inbound"}, {"lat": 49.28571701049805, "lng": -123.11918640136719, "route": "37807", "vehicle": 16218, "direction": "Outbound", "color": "red", "info": "Vehicle: 16218, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.05411529541016, "route": "37807", "vehicle": 23009, "direction": "Inbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28162908554077, lng: -123.04531717300415 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

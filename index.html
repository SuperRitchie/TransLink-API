
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281898498535156, "lng": -123.10648345947266, "route": "37807", "vehicle": 19017, "direction": "Inbound", "color": "green", "info": "Vehicle: 19017, Route: 37807, Direction: Inbound"}, {"lat": 49.28141784667969, "lng": -123.10006713867188, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.05763244628906, "route": "37807", "vehicle": 9771, "direction": "Inbound", "color": "red", "info": "Vehicle: 9771, Route: 37807, Direction: Inbound"}, {"lat": 49.28031539916992, "lng": -122.98118591308594, "route": "37807", "vehicle": 19012, "direction": "Outbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Outbound"}, {"lat": 49.273765563964844, "lng": -122.9298324584961, "route": "37807", "vehicle": 19014, "direction": "Outbound", "color": "green", "info": "Vehicle: 19014, Route: 37807, Direction: Outbound"}, {"lat": 49.27933120727539, "lng": -122.94916534423828, "route": "37807", "vehicle": 19046, "direction": "Outbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Outbound"}, {"lat": 49.280433654785156, "lng": -122.97151947021484, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.281715393066406, "lng": -123.10493469238281, "route": "37807", "vehicle": 19039, "direction": "Outbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.05831909179688, "route": "37807", "vehicle": 19042, "direction": "Outbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.0567855834961, "route": "37807", "vehicle": 19033, "direction": "Outbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.03683471679688, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91273498535156, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.27629852294922, "lng": -122.91516876220703, "route": "37807", "vehicle": 9628, "direction": "Inbound", "color": "red", "info": "Vehicle: 9628, Route: 37807, Direction: Inbound"}, {"lat": 49.28046798706055, "lng": -122.9540023803711, "route": "37807", "vehicle": 23007, "direction": "Inbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Inbound"}, {"lat": 49.284584045410156, "lng": -123.11461639404297, "route": "37807", "vehicle": 19032, "direction": "Inbound", "color": "green", "info": "Vehicle: 19032, Route: 37807, Direction: Inbound"}, {"lat": 49.28536605834961, "lng": -123.11955261230469, "route": "37807", "vehicle": 19043, "direction": "Inbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Inbound"}, {"lat": 49.28675079345703, "lng": -123.11609649658203, "route": "37807", "vehicle": 22008, "direction": "Outbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.0228500366211, "route": "37807", "vehicle": 19021, "direction": "Inbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28092850579156, lng: -123.02821011013455 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2813835144043, "lng": -123.09934997558594, "route": "37807", "vehicle": 22015, "direction": "Inbound", "color": "green", "info": "Vehicle: 22015, Route: 37807, Direction: Inbound"}, {"lat": 49.28139877319336, "lng": -123.101318359375, "route": "37807", "vehicle": 19006, "direction": "Inbound", "color": "green", "info": "Vehicle: 19006, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.03279876708984, "route": "37807", "vehicle": 22014, "direction": "Inbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Inbound"}, {"lat": 49.280982971191406, "lng": -123.01351928710938, "route": "37807", "vehicle": 18060, "direction": "Outbound", "color": "green", "info": "Vehicle: 18060, Route: 37807, Direction: Outbound"}, {"lat": 49.2802848815918, "lng": -122.97968292236328, "route": "37807", "vehicle": 16201, "direction": "Outbound", "color": "red", "info": "Vehicle: 16201, Route: 37807, Direction: Outbound"}, {"lat": 49.2741813659668, "lng": -122.92742919921875, "route": "37807", "vehicle": 23012, "direction": "Inbound", "color": "green", "info": "Vehicle: 23012, Route: 37807, Direction: Inbound"}, {"lat": 49.281368255615234, "lng": -123.10160064697266, "route": "37807", "vehicle": 19044, "direction": "Outbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.06576538085938, "route": "37807", "vehicle": 19047, "direction": "Outbound", "color": "green", "info": "Vehicle: 19047, Route: 37807, Direction: Outbound"}, {"lat": 49.27851867675781, "lng": -122.91276550292969, "route": "37807", "vehicle": 19010, "direction": "Inbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Inbound"}, {"lat": 49.285484313964844, "lng": -123.11398315429688, "route": "37807", "vehicle": 19024, "direction": "Outbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Outbound"}, {"lat": 49.28523254394531, "lng": -123.11981964111328, "route": "37807", "vehicle": 23006, "direction": "Outbound", "color": "green", "info": "Vehicle: 23006, Route: 37807, Direction: Outbound"}, {"lat": 49.28535079956055, "lng": -123.11776733398438, "route": "37807", "vehicle": 15018, "direction": "Outbound", "color": "red", "info": "Vehicle: 15018, Route: 37807, Direction: Outbound"}, {"lat": 49.28536605834961, "lng": -123.11949920654297, "route": "37807", "vehicle": 8122, "direction": "Outbound", "color": "red", "info": "Vehicle: 8122, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.00843048095703, "route": "37807", "vehicle": 23002, "direction": "Inbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.05290222167969, "route": "37807", "vehicle": 19025, "direction": "Inbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.0556640625, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.0389633178711, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281555624569165, lng: -123.05066232120289 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28139877319336, "lng": -123.09923553466797, "route": "37807", "vehicle": 24010, "direction": "Inbound", "color": "green", "info": "Vehicle: 24010, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.02678680419922, "route": "37807", "vehicle": 9660, "direction": "Outbound", "color": "red", "info": "Vehicle: 9660, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.03278350830078, "route": "37807", "vehicle": 23002, "direction": "Inbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Inbound"}, {"lat": 49.28099822998047, "lng": -123.01335144042969, "route": "37807", "vehicle": 24013, "direction": "Outbound", "color": "green", "info": "Vehicle: 24013, Route: 37807, Direction: Outbound"}, {"lat": 49.28033447265625, "lng": -122.9522705078125, "route": "37807", "vehicle": 24012, "direction": "Outbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Outbound"}, {"lat": 49.28105163574219, "lng": -123.00146484375, "route": "37807", "vehicle": 22014, "direction": "Inbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.08781433105469, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.09571838378906, "route": "37807", "vehicle": 22010, "direction": "Outbound", "color": "green", "info": "Vehicle: 22010, Route: 37807, Direction: Outbound"}, {"lat": 49.276248931884766, "lng": -122.91513061523438, "route": "37807", "vehicle": 22007, "direction": "Inbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Inbound"}, {"lat": 49.28598403930664, "lng": -123.11883544921875, "route": "37807", "vehicle": 19047, "direction": "Outbound", "color": "green", "info": "Vehicle: 19047, Route: 37807, Direction: Outbound"}, {"lat": 49.28721618652344, "lng": -123.11603546142578, "route": "37807", "vehicle": 23009, "direction": "Outbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Outbound"}, {"lat": 49.286949157714844, "lng": -123.11751556396484, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.0504150390625, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.28120040893555, "lng": -123.04558563232422, "route": "37807", "vehicle": 19006, "direction": "Inbound", "color": "green", "info": "Vehicle: 19006, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281942640032085, lng: -123.04806736537388 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

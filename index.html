
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28200149536133, "lng": -123.10691833496094, "route": "37807", "vehicle": 24008, "direction": "Inbound", "color": "green", "info": "Vehicle: 24008, Route: 37807, Direction: Inbound"}, {"lat": 49.28129959106445, "lng": -123.09528350830078, "route": "37807", "vehicle": 23006, "direction": "Inbound", "color": "green", "info": "Vehicle: 23006, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.03230285644531, "route": "37807", "vehicle": 23015, "direction": "Outbound", "color": "green", "info": "Vehicle: 23015, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.03278350830078, "route": "37807", "vehicle": 23009, "direction": "Outbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Outbound"}, {"lat": 49.28091812133789, "lng": -122.99563598632812, "route": "37807", "vehicle": 19027, "direction": "Outbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Outbound"}, {"lat": 49.28093338012695, "lng": -122.99491882324219, "route": "37807", "vehicle": 19034, "direction": "Outbound", "color": "green", "info": "Vehicle: 19034, Route: 37807, Direction: Outbound"}, {"lat": 49.27748489379883, "lng": -122.9222640991211, "route": "37807", "vehicle": 23001, "direction": "Outbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Outbound"}, {"lat": 49.27731704711914, "lng": -122.92308044433594, "route": "37807", "vehicle": 23014, "direction": "Outbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Outbound"}, {"lat": 49.2807502746582, "lng": -122.92279815673828, "route": "37807", "vehicle": 23002, "direction": "Inbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.0940170288086, "route": "37807", "vehicle": 8147, "direction": "Outbound", "color": "red", "info": "Vehicle: 8147, Route: 37807, Direction: Outbound"}, {"lat": 49.281150817871094, "lng": -123.06241607666016, "route": "37807", "vehicle": 24012, "direction": "Outbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.01029968261719, "route": "37807", "vehicle": 16220, "direction": "Inbound", "color": "red", "info": "Vehicle: 16220, Route: 37807, Direction: Inbound"}, {"lat": 49.278533935546875, "lng": -122.91273498535156, "route": "37807", "vehicle": 19032, "direction": "Inbound", "color": "green", "info": "Vehicle: 19032, Route: 37807, Direction: Inbound"}, {"lat": 49.28036880493164, "lng": -122.96299743652344, "route": "37807", "vehicle": 15009, "direction": "Inbound", "color": "red", "info": "Vehicle: 15009, Route: 37807, Direction: Inbound"}, {"lat": 49.28348159790039, "lng": -123.111083984375, "route": "37807", "vehicle": 19013, "direction": "Outbound", "color": "green", "info": "Vehicle: 19013, Route: 37807, Direction: Outbound"}, {"lat": 49.282283782958984, "lng": -123.10858154296875, "route": "37807", "vehicle": 23012, "direction": "Outbound", "color": "green", "info": "Vehicle: 23012, Route: 37807, Direction: Outbound"}, {"lat": 49.28525161743164, "lng": -123.11930084228516, "route": "37807", "vehicle": 15012, "direction": "Inbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Inbound"}, {"lat": 49.285400390625, "lng": -123.11976623535156, "route": "37807", "vehicle": 22006, "direction": "Inbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Inbound"}, {"lat": 49.285682678222656, "lng": -123.11813354492188, "route": "37807", "vehicle": 16224, "direction": "Outbound", "color": "red", "info": "Vehicle: 16224, Route: 37807, Direction: Outbound"}, {"lat": 49.286231994628906, "lng": -123.11814880371094, "route": "37807", "vehicle": 8148, "direction": "Outbound", "color": "red", "info": "Vehicle: 8148, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.0057144165039, "route": "37807", "vehicle": 24005, "direction": "Inbound", "color": "green", "info": "Vehicle: 24005, Route: 37807, Direction: Inbound"}, {"lat": 49.28120040893555, "lng": -123.04568481445312, "route": "37807", "vehicle": 23010, "direction": "Inbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Inbound"}, {"lat": 49.28120040893555, "lng": -123.05621337890625, "route": "37807", "vehicle": 24013, "direction": "Inbound", "color": "green", "info": "Vehicle: 24013, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281615381655484, lng: -123.03787297787873 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

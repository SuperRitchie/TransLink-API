
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28128433227539, "lng": -123.0940170288086, "route": "37807", "vehicle": 23009, "direction": "Inbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.08071899414062, "route": "37807", "vehicle": 19022, "direction": "Inbound", "color": "green", "info": "Vehicle: 19022, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.04765319824219, "route": "37807", "vehicle": 16218, "direction": "Outbound", "color": "red", "info": "Vehicle: 16218, Route: 37807, Direction: Outbound"}, {"lat": 49.28099822998047, "lng": -123.01322937011719, "route": "37807", "vehicle": 16220, "direction": "Outbound", "color": "red", "info": "Vehicle: 16220, Route: 37807, Direction: Outbound"}, {"lat": 49.28030014038086, "lng": -122.96630096435547, "route": "37807", "vehicle": 19012, "direction": "Outbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Outbound"}, {"lat": 49.28033447265625, "lng": -122.95428466796875, "route": "37807", "vehicle": 8122, "direction": "Outbound", "color": "red", "info": "Vehicle: 8122, Route: 37807, Direction: Outbound"}, {"lat": 49.2735481262207, "lng": -122.92608642578125, "route": "37807", "vehicle": 8156, "direction": "Outbound", "color": "red", "info": "Vehicle: 8156, Route: 37807, Direction: Outbound"}, {"lat": 49.27768325805664, "lng": -122.94613647460938, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -122.99458312988281, "route": "37807", "vehicle": 19035, "direction": "Inbound", "color": "green", "info": "Vehicle: 19035, Route: 37807, Direction: Inbound"}, {"lat": 49.282283782958984, "lng": -123.10848236083984, "route": "37807", "vehicle": 22008, "direction": "Outbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Outbound"}, {"lat": 49.280967712402344, "lng": -123.08190155029297, "route": "37807", "vehicle": 9766, "direction": "Outbound", "color": "red", "info": "Vehicle: 9766, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.0705337524414, "route": "37807", "vehicle": 23014, "direction": "Outbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Outbound"}, {"lat": 49.2803840637207, "lng": -122.98611450195312, "route": "37807", "vehicle": 23012, "direction": "Inbound", "color": "green", "info": "Vehicle: 23012, Route: 37807, Direction: Inbound"}, {"lat": 49.27843475341797, "lng": -122.9124526977539, "route": "37807", "vehicle": 22007, "direction": "Inbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 19018, "direction": "Inbound", "color": "green", "info": "Vehicle: 19018, Route: 37807, Direction: Inbound"}, {"lat": 49.27803421020508, "lng": -122.91071319580078, "route": "37807", "vehicle": 19029, "direction": "Inbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Inbound"}, {"lat": 49.28561782836914, "lng": -123.11910247802734, "route": "37807", "vehicle": 24015, "direction": "Inbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Inbound"}, {"lat": 49.28335189819336, "lng": -123.11688232421875, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.286399841308594, "lng": -123.11772918701172, "route": "37807", "vehicle": 23008, "direction": "Outbound", "color": "green", "info": "Vehicle: 23008, Route: 37807, Direction: Outbound"}, {"lat": 49.28611755371094, "lng": -123.11861419677734, "route": "37807", "vehicle": 9731, "direction": "Outbound", "color": "red", "info": "Vehicle: 9731, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.01331329345703, "route": "37807", "vehicle": 22004, "direction": "Inbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28093991960798, lng: -123.02340952555339 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

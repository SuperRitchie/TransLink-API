
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2811164855957, "lng": -123.05554962158203, "route": "37807", "vehicle": 9666, "direction": "Outbound", "color": "red", "info": "Vehicle: 9666, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.02490234375, "route": "37807", "vehicle": 23006, "direction": "Outbound", "color": "green", "info": "Vehicle: 23006, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.05438232421875, "route": "37807", "vehicle": 24003, "direction": "Inbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.0158462524414, "route": "37807", "vehicle": 22010, "direction": "Outbound", "color": "green", "info": "Vehicle: 22010, Route: 37807, Direction: Outbound"}, {"lat": 49.28016662597656, "lng": -122.959716796875, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.27439880371094, "lng": -122.92703247070312, "route": "37807", "vehicle": 19021, "direction": "Outbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Outbound"}, {"lat": 49.2814826965332, "lng": -123.1044692993164, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.07048034667969, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.03858184814453, "route": "37807", "vehicle": 22011, "direction": "Inbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 19044, "direction": "Inbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Inbound"}, {"lat": 49.27695083618164, "lng": -122.91835021972656, "route": "37807", "vehicle": 19024, "direction": "Inbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.95843505859375, "route": "37807", "vehicle": 19042, "direction": "Inbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Inbound"}, {"lat": 49.28431701660156, "lng": -123.1167984008789, "route": "37807", "vehicle": 24004, "direction": "Inbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Inbound"}, {"lat": 49.2845344543457, "lng": -123.11783599853516, "route": "37807", "vehicle": 9607, "direction": "Inbound", "color": "red", "info": "Vehicle: 9607, Route: 37807, Direction: Inbound"}, {"lat": 49.285133361816406, "lng": -123.11334991455078, "route": "37807", "vehicle": 19040, "direction": "Inbound", "color": "green", "info": "Vehicle: 19040, Route: 37807, Direction: Inbound"}, {"lat": 49.286231994628906, "lng": -123.11830139160156, "route": "37807", "vehicle": 19043, "direction": "Outbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Outbound"}, {"lat": 49.286033630371094, "lng": -123.11859893798828, "route": "37807", "vehicle": 22012, "direction": "Outbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Outbound"}, {"lat": 49.2811164855957, "lng": -123.00381469726562, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28145090738932, lng: -123.03495534261067 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

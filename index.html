
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281333923339844, "lng": -123.07118225097656, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.281150817871094, "lng": -123.05561828613281, "route": "37807", "vehicle": 19008, "direction": "Outbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Outbound"}, {"lat": 49.2811164855957, "lng": -123.0506820678711, "route": "37807", "vehicle": 23011, "direction": "Outbound", "color": "green", "info": "Vehicle: 23011, Route: 37807, Direction: Outbound"}, {"lat": 49.28125, "lng": -123.03278350830078, "route": "37807", "vehicle": 19024, "direction": "Inbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.02034759521484, "route": "37807", "vehicle": 24011, "direction": "Outbound", "color": "green", "info": "Vehicle: 24011, Route: 37807, Direction: Outbound"}, {"lat": 49.280982971191406, "lng": -123.00489807128906, "route": "37807", "vehicle": 22004, "direction": "Outbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Outbound"}, {"lat": 49.27506637573242, "lng": -122.94023132324219, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.02546691894531, "route": "37807", "vehicle": 24001, "direction": "Inbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Inbound"}, {"lat": 49.280418395996094, "lng": -122.96438598632812, "route": "37807", "vehicle": 24010, "direction": "Inbound", "color": "green", "info": "Vehicle: 24010, Route: 37807, Direction: Inbound"}, {"lat": 49.283931732177734, "lng": -123.11136627197266, "route": "37807", "vehicle": 23013, "direction": "Outbound", "color": "green", "info": "Vehicle: 23013, Route: 37807, Direction: Outbound"}, {"lat": 49.2859992980957, "lng": -123.1182861328125, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.2869987487793, "lng": -123.11713409423828, "route": "37807", "vehicle": 24007, "direction": "Outbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.05525207519531, "route": "37807", "vehicle": 22014, "direction": "Inbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28167020357572, lng: -123.04366419865535 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

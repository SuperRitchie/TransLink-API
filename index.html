
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28120040893555, "lng": -123.0607681274414, "route": "37807", "vehicle": 23013, "direction": "Inbound", "color": "green", "info": "Vehicle: 23013, Route: 37807, Direction: Inbound"}, {"lat": 49.28033447265625, "lng": -122.9865493774414, "route": "37807", "vehicle": 24007, "direction": "Outbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Outbound"}, {"lat": 49.28026580810547, "lng": -122.97156524658203, "route": "37807", "vehicle": 24006, "direction": "Outbound", "color": "green", "info": "Vehicle: 24006, Route: 37807, Direction: Outbound"}, {"lat": 49.27903366088867, "lng": -122.94866943359375, "route": "37807", "vehicle": 19042, "direction": "Outbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Outbound"}, {"lat": 49.280616760253906, "lng": -122.91152954101562, "route": "37807", "vehicle": 22012, "direction": "Outbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Outbound"}, {"lat": 49.280433654785156, "lng": -122.98141479492188, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.06282043457031, "route": "37807", "vehicle": 23009, "direction": "Outbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.02535247802734, "route": "37807", "vehicle": 15012, "direction": "Inbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Inbound"}, {"lat": 49.279083251953125, "lng": -122.91107940673828, "route": "37807", "vehicle": 19024, "direction": "Inbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91273498535156, "route": "37807", "vehicle": 23014, "direction": "Inbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.95845031738281, "route": "37807", "vehicle": 16203, "direction": "Inbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Inbound"}, {"lat": 49.2855339050293, "lng": -123.11544799804688, "route": "37807", "vehicle": 19031, "direction": "Inbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Inbound"}, {"lat": 49.28256607055664, "lng": -123.10955047607422, "route": "37807", "vehicle": 24001, "direction": "Inbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Inbound"}, {"lat": 49.28675079345703, "lng": -123.11786651611328, "route": "37807", "vehicle": 23010, "direction": "Outbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Outbound"}, {"lat": 49.28591537475586, "lng": -123.1186294555664, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}, {"lat": 49.286983489990234, "lng": -123.1185531616211, "route": "37807", "vehicle": 24002, "direction": "Outbound", "color": "green", "info": "Vehicle: 24002, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.0517349243164, "route": "37807", "vehicle": 19020, "direction": "Inbound", "color": "green", "info": "Vehicle: 19020, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.04536437988281, "route": "37807", "vehicle": 16223, "direction": "Outbound", "color": "red", "info": "Vehicle: 16223, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28179105122884, lng: -123.02267116970486 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

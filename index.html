
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.284584045410156, "lng": -123.11453247070312, "route": "37807", "vehicle": 16201, "direction": "Inbound", "color": "red", "info": "Vehicle: 16201, Route: 37807, Direction: Inbound"}, {"lat": 49.281333923339844, "lng": -123.07078552246094, "route": "37807", "vehicle": 22011, "direction": "Inbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.0379867553711, "route": "37807", "vehicle": 22001, "direction": "Outbound", "color": "green", "info": "Vehicle: 22001, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.05508422851562, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.28004837036133, "lng": -122.99114990234375, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28016662597656, "lng": -122.92051696777344, "route": "37807", "vehicle": 19046, "direction": "Outbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Outbound"}, {"lat": 49.277801513671875, "lng": -122.9466323852539, "route": "37807", "vehicle": 9732, "direction": "Outbound", "color": "red", "info": "Vehicle: 9732, Route: 37807, Direction: Outbound"}, {"lat": 49.275848388671875, "lng": -122.9300537109375, "route": "37807", "vehicle": 16203, "direction": "Inbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Inbound"}, {"lat": 49.27933120727539, "lng": -122.94898223876953, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.98176574707031, "route": "37807", "vehicle": 9712, "direction": "Inbound", "color": "red", "info": "Vehicle: 9712, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -122.99797058105469, "route": "37807", "vehicle": 19026, "direction": "Inbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Inbound"}, {"lat": 49.281368255615234, "lng": -123.10250091552734, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.0566177368164, "route": "37807", "vehicle": 22005, "direction": "Outbound", "color": "green", "info": "Vehicle: 22005, Route: 37807, Direction: Outbound"}, {"lat": 49.278499603271484, "lng": -122.91276550292969, "route": "37807", "vehicle": 8143, "direction": "Inbound", "color": "red", "info": "Vehicle: 8143, Route: 37807, Direction: Inbound"}, {"lat": 49.27826690673828, "lng": -122.91218566894531, "route": "37807", "vehicle": 19032, "direction": "Inbound", "color": "green", "info": "Vehicle: 19032, Route: 37807, Direction: Inbound"}, {"lat": 49.284767150878906, "lng": -123.11270141601562, "route": "37807", "vehicle": 24003, "direction": "Inbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Inbound"}, {"lat": 49.28611755371094, "lng": -123.11933135986328, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.28601837158203, "lng": -123.1184310913086, "route": "37807", "vehicle": 19036, "direction": "Outbound", "color": "green", "info": "Vehicle: 19036, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.02171325683594, "route": "37807", "vehicle": 16226, "direction": "Inbound", "color": "red", "info": "Vehicle: 16226, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281062477513366, lng: -123.01851091886822 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

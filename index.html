
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281349182128906, "lng": -123.10070037841797, "route": "37807", "vehicle": 19018, "direction": "Inbound", "color": "green", "info": "Vehicle: 19018, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.02583312988281, "route": "37807", "vehicle": 9773, "direction": "Outbound", "color": "red", "info": "Vehicle: 9773, Route: 37807, Direction: Outbound"}, {"lat": 49.2762336730957, "lng": -122.94400024414062, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.27906799316406, "lng": -122.91226959228516, "route": "37807", "vehicle": 19021, "direction": "Outbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Outbound"}, {"lat": 49.282066345214844, "lng": -123.10731506347656, "route": "37807", "vehicle": 19012, "direction": "Outbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Outbound"}, {"lat": 49.28156661987305, "lng": -123.10462951660156, "route": "37807", "vehicle": 19028, "direction": "Outbound", "color": "green", "info": "Vehicle: 19028, Route: 37807, Direction: Outbound"}, {"lat": 49.28123474121094, "lng": -123.07389831542969, "route": "37807", "vehicle": 9712, "direction": "Outbound", "color": "red", "info": "Vehicle: 9712, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.0253677368164, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.278499603271484, "lng": -122.91273498535156, "route": "37807", "vehicle": 24013, "direction": "Inbound", "color": "green", "info": "Vehicle: 24013, Route: 37807, Direction: Inbound"}, {"lat": 49.28049850463867, "lng": -122.95921325683594, "route": "37807", "vehicle": 23011, "direction": "Inbound", "color": "green", "info": "Vehicle: 23011, Route: 37807, Direction: Inbound"}, {"lat": 49.28543472290039, "lng": -123.1181640625, "route": "37807", "vehicle": 19022, "direction": "Outbound", "color": "green", "info": "Vehicle: 19022, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28074576637962, lng: -123.0258296619762 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

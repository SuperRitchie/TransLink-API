
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2814826965332, "lng": -123.10271453857422, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.28141784667969, "lng": -123.10189819335938, "route": "37807", "vehicle": 9732, "direction": "Inbound", "color": "red", "info": "Vehicle: 9732, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.07965087890625, "route": "37807", "vehicle": 16201, "direction": "Inbound", "color": "red", "info": "Vehicle: 16201, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.09104919433594, "route": "37807", "vehicle": 23002, "direction": "Inbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Inbound"}, {"lat": 49.28131866455078, "lng": -123.06964874267578, "route": "37807", "vehicle": 19006, "direction": "Inbound", "color": "green", "info": "Vehicle: 19006, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.04985046386719, "route": "37807", "vehicle": 23009, "direction": "Outbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Outbound"}, {"lat": 49.28105163574219, "lng": -123.04598236083984, "route": "37807", "vehicle": 15012, "direction": "Outbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Outbound"}, {"lat": 49.28030014038086, "lng": -122.98323059082031, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.277034759521484, "lng": -122.92731475830078, "route": "37807", "vehicle": 16221, "direction": "Outbound", "color": "red", "info": "Vehicle: 16221, Route: 37807, Direction: Outbound"}, {"lat": 49.275634765625, "lng": -122.94243621826172, "route": "37807", "vehicle": 8122, "direction": "Inbound", "color": "red", "info": "Vehicle: 8122, Route: 37807, Direction: Inbound"}, {"lat": 49.28034973144531, "lng": -122.99009704589844, "route": "37807", "vehicle": 24012, "direction": "Inbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Inbound"}, {"lat": 49.28129959106445, "lng": -123.09577941894531, "route": "37807", "vehicle": 19044, "direction": "Outbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Outbound"}, {"lat": 49.2811164855957, "lng": -123.0631332397461, "route": "37807", "vehicle": 8143, "direction": "Outbound", "color": "red", "info": "Vehicle: 8143, Route: 37807, Direction: Outbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 22004, "direction": "Inbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Inbound"}, {"lat": 49.27840042114258, "lng": -122.9124526977539, "route": "37807", "vehicle": 24015, "direction": "Inbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Inbound"}, {"lat": 49.278316497802734, "lng": -122.91058349609375, "route": "37807", "vehicle": 24013, "direction": "Inbound", "color": "green", "info": "Vehicle: 24013, Route: 37807, Direction: Inbound"}, {"lat": 49.28364944458008, "lng": -123.11096954345703, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.28201675415039, "lng": -123.10693359375, "route": "37807", "vehicle": 24007, "direction": "Inbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Inbound"}, {"lat": 49.28273391723633, "lng": -123.10977935791016, "route": "37807", "vehicle": 9652, "direction": "Inbound", "color": "red", "info": "Vehicle: 9652, Route: 37807, Direction: Inbound"}, {"lat": 49.28696823120117, "lng": -123.11705017089844, "route": "37807", "vehicle": 19047, "direction": "Outbound", "color": "green", "info": "Vehicle: 19047, Route: 37807, Direction: Outbound"}, {"lat": 49.285831451416016, "lng": -123.11837005615234, "route": "37807", "vehicle": 24010, "direction": "Outbound", "color": "green", "info": "Vehicle: 24010, Route: 37807, Direction: Outbound"}, {"lat": 49.2811164855957, "lng": -123.01331329345703, "route": "37807", "vehicle": 22007, "direction": "Inbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.0456314086914, "route": "37807", "vehicle": 22014, "direction": "Inbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.04508209228516, "route": "37807", "vehicle": 15019, "direction": "Outbound", "color": "red", "info": "Vehicle: 15019, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.04478454589844, "route": "37807", "vehicle": 22010, "direction": "Outbound", "color": "green", "info": "Vehicle: 22010, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281010131835934, lng: -123.03961944580078 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

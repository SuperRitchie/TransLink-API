
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2813835144043, "lng": -123.07701873779297, "route": "37807", "vehicle": 8146, "direction": "Inbound", "color": "red", "info": "Vehicle: 8146, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.04951477050781, "route": "37807", "vehicle": 19044, "direction": "Outbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.02531433105469, "route": "37807", "vehicle": 8148, "direction": "Outbound", "color": "red", "info": "Vehicle: 8148, Route: 37807, Direction: Outbound"}, {"lat": 49.28016662597656, "lng": -122.99031829833984, "route": "37807", "vehicle": 22009, "direction": "Outbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Outbound"}, {"lat": 49.28013229370117, "lng": -122.9186019897461, "route": "37807", "vehicle": 24015, "direction": "Outbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Outbound"}, {"lat": 49.2803840637207, "lng": -122.97480010986328, "route": "37807", "vehicle": 16221, "direction": "Inbound", "color": "red", "info": "Vehicle: 16221, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.09480285644531, "route": "37807", "vehicle": 19024, "direction": "Outbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.07081604003906, "route": "37807", "vehicle": 19039, "direction": "Outbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Outbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 23002, "direction": "Inbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Inbound"}, {"lat": 49.286216735839844, "lng": -123.1147689819336, "route": "37807", "vehicle": 9755, "direction": "Outbound", "color": "red", "info": "Vehicle: 9755, Route: 37807, Direction: Outbound"}, {"lat": 49.283531188964844, "lng": -123.11105346679688, "route": "37807", "vehicle": 9798, "direction": "Outbound", "color": "red", "info": "Vehicle: 9798, Route: 37807, Direction: Outbound"}, {"lat": 49.28573226928711, "lng": -123.114501953125, "route": "37807", "vehicle": 24001, "direction": "Inbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Inbound"}, {"lat": 49.28668212890625, "lng": -123.11888122558594, "route": "37807", "vehicle": 22003, "direction": "Outbound", "color": "green", "info": "Vehicle: 22003, Route: 37807, Direction: Outbound"}, {"lat": 49.27479934692383, "lng": -122.93873596191406, "route": "37807", "vehicle": 22001, "direction": "Inbound", "color": "green", "info": "Vehicle: 22001, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28157833644322, lng: -123.0365627833775 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28141784667969, "lng": -123.09933471679688, "route": "37807", "vehicle": 19010, "direction": "Inbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Inbound"}, {"lat": 49.28141784667969, "lng": -123.10272979736328, "route": "37807", "vehicle": 19016, "direction": "Inbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.05590057373047, "route": "37807", "vehicle": 19039, "direction": "Outbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Outbound"}, {"lat": 49.2810173034668, "lng": -123.01331329345703, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}, {"lat": 49.277015686035156, "lng": -122.94536590576172, "route": "37807", "vehicle": 23001, "direction": "Outbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Outbound"}, {"lat": 49.28020095825195, "lng": -122.99141693115234, "route": "37807", "vehicle": 24013, "direction": "Inbound", "color": "green", "info": "Vehicle: 24013, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.06285095214844, "route": "37807", "vehicle": 19031, "direction": "Outbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.05686950683594, "route": "37807", "vehicle": 19045, "direction": "Outbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Outbound"}, {"lat": 49.27766799926758, "lng": -122.90916442871094, "route": "37807", "vehicle": 19037, "direction": "Inbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Inbound"}, {"lat": 49.282649993896484, "lng": -123.10984802246094, "route": "37807", "vehicle": 19019, "direction": "Outbound", "color": "green", "info": "Vehicle: 19019, Route: 37807, Direction: Outbound"}, {"lat": 49.28435134887695, "lng": -123.11720275878906, "route": "37807", "vehicle": 22012, "direction": "Inbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Inbound"}, {"lat": 49.28638458251953, "lng": -123.1186294555664, "route": "37807", "vehicle": 19013, "direction": "Outbound", "color": "green", "info": "Vehicle: 19013, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.04889678955078, "route": "37807", "vehicle": 23008, "direction": "Inbound", "color": "green", "info": "Vehicle: 23008, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28128521259014, lng: -123.04857870248648 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

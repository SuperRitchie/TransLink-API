
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28123474121094, "lng": -123.09323120117188, "route": "37807", "vehicle": 19008, "direction": "Inbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Inbound"}, {"lat": 49.28131866455078, "lng": -123.0974349975586, "route": "37807", "vehicle": 19009, "direction": "Inbound", "color": "green", "info": "Vehicle: 19009, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.02594757080078, "route": "37807", "vehicle": 22014, "direction": "Outbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.03276824951172, "route": "37807", "vehicle": 19033, "direction": "Inbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Inbound"}, {"lat": 49.2803840637207, "lng": -122.95614624023438, "route": "37807", "vehicle": 22012, "direction": "Outbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Outbound"}, {"lat": 49.28044891357422, "lng": -122.97055053710938, "route": "37807", "vehicle": 19046, "direction": "Inbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Inbound"}, {"lat": 49.281150817871094, "lng": -123.09046936035156, "route": "37807", "vehicle": 8151, "direction": "Outbound", "color": "red", "info": "Vehicle: 8151, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.05960083007812, "route": "37807", "vehicle": 19043, "direction": "Outbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Outbound"}, {"lat": 49.276466369628906, "lng": -122.90958404541016, "route": "37807", "vehicle": 19010, "direction": "Inbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Inbound"}, {"lat": 49.284000396728516, "lng": -123.11109924316406, "route": "37807", "vehicle": 23010, "direction": "Outbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Outbound"}, {"lat": 49.28638458251953, "lng": -123.11833190917969, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.28630065917969, "lng": -123.1186294555664, "route": "37807", "vehicle": 19044, "direction": "Outbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.04573059082031, "route": "37807", "vehicle": 16224, "direction": "Inbound", "color": "red", "info": "Vehicle: 16224, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28171920776367, lng: -123.04842494084285 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

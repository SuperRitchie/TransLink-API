
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28125, "lng": -123.09346771240234, "route": "37807", "vehicle": 24001, "direction": "Inbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Inbound"}, {"lat": 49.28126525878906, "lng": -123.03279876708984, "route": "37807", "vehicle": 24006, "direction": "Inbound", "color": "green", "info": "Vehicle: 24006, Route: 37807, Direction: Inbound"}, {"lat": 49.28126525878906, "lng": -123.03253173828125, "route": "37807", "vehicle": 8148, "direction": "Inbound", "color": "red", "info": "Vehicle: 8148, Route: 37807, Direction: Inbound"}, {"lat": 49.28031539916992, "lng": -122.98446655273438, "route": "37807", "vehicle": 24010, "direction": "Outbound", "color": "green", "info": "Vehicle: 24010, Route: 37807, Direction: Outbound"}, {"lat": 49.279117584228516, "lng": -122.91217041015625, "route": "37807", "vehicle": 19027, "direction": "Outbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Outbound"}, {"lat": 49.27691650390625, "lng": -122.93238067626953, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.00288391113281, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.2813835144043, "lng": -123.10164642333984, "route": "37807", "vehicle": 23010, "direction": "Outbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.05828094482422, "route": "37807", "vehicle": 8143, "direction": "Outbound", "color": "red", "info": "Vehicle: 8143, Route: 37807, Direction: Outbound"}, {"lat": 49.28538131713867, "lng": -123.11381530761719, "route": "37807", "vehicle": 16223, "direction": "Inbound", "color": "red", "info": "Vehicle: 16223, Route: 37807, Direction: Inbound"}, {"lat": 49.28521728515625, "lng": -123.11978149414062, "route": "37807", "vehicle": 23008, "direction": "Inbound", "color": "green", "info": "Vehicle: 23008, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.05194854736328, "route": "37807", "vehicle": 22006, "direction": "Inbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.03904724121094, "route": "37807", "vehicle": 19036, "direction": "Outbound", "color": "green", "info": "Vehicle: 19036, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28127640944261, lng: -123.03655536358173 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

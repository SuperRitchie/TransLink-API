
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281333923339844, "lng": -123.09700012207031, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.2813835144043, "lng": -123.07659912109375, "route": "37807", "vehicle": 19028, "direction": "Inbound", "color": "green", "info": "Vehicle: 19028, Route: 37807, Direction: Inbound"}, {"lat": 49.281131744384766, "lng": -123.05211639404297, "route": "37807", "vehicle": 19036, "direction": "Outbound", "color": "green", "info": "Vehicle: 19036, Route: 37807, Direction: Outbound"}, {"lat": 49.28103256225586, "lng": -123.03306579589844, "route": "37807", "vehicle": 23009, "direction": "Outbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Outbound"}, {"lat": 49.2802848815918, "lng": -122.96869659423828, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.276615142822266, "lng": -122.93160247802734, "route": "37807", "vehicle": 22011, "direction": "Inbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Inbound"}, {"lat": 49.2803840637207, "lng": -122.97486877441406, "route": "37807", "vehicle": 15012, "direction": "Inbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Inbound"}, {"lat": 49.28223419189453, "lng": -123.10859680175781, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}, {"lat": 49.28123474121094, "lng": -123.03118133544922, "route": "37807", "vehicle": 22002, "direction": "Inbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Inbound"}, {"lat": 49.27848434448242, "lng": -122.91241455078125, "route": "37807", "vehicle": 23002, "direction": "Inbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Inbound"}, {"lat": 49.28048324584961, "lng": -122.96786499023438, "route": "37807", "vehicle": 8122, "direction": "Inbound", "color": "red", "info": "Vehicle: 8122, Route: 37807, Direction: Inbound"}, {"lat": 49.281982421875, "lng": -123.10690307617188, "route": "37807", "vehicle": 16203, "direction": "Inbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Inbound"}, {"lat": 49.28609848022461, "lng": -123.118896484375, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.28671646118164, "lng": -123.1162338256836, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281385694231304, lng: -123.03543145315987 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

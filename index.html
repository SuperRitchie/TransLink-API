
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2813835144043, "lng": -123.1008529663086, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.06517028808594, "route": "37807", "vehicle": 22010, "direction": "Inbound", "color": "green", "info": "Vehicle: 22010, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.04367065429688, "route": "37807", "vehicle": 22008, "direction": "Outbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Outbound"}, {"lat": 49.28105163574219, "lng": -123.02429962158203, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.02664947509766, "route": "37807", "vehicle": 9775, "direction": "Outbound", "color": "red", "info": "Vehicle: 9775, Route: 37807, Direction: Outbound"}, {"lat": 49.28031539916992, "lng": -122.9847183227539, "route": "37807", "vehicle": 24003, "direction": "Outbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Outbound"}, {"lat": 49.279083251953125, "lng": -122.91228485107422, "route": "37807", "vehicle": 24004, "direction": "Outbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Outbound"}, {"lat": 49.28103256225586, "lng": -122.99593353271484, "route": "37807", "vehicle": 19030, "direction": "Inbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Inbound"}, {"lat": 49.28218460083008, "lng": -123.10759735107422, "route": "37807", "vehicle": 19024, "direction": "Outbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Outbound"}, {"lat": 49.28103256225586, "lng": -123.08243560791016, "route": "37807", "vehicle": 19042, "direction": "Outbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Outbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 22012, "direction": "Inbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Inbound"}, {"lat": 49.28046798706055, "lng": -122.9540023803711, "route": "37807", "vehicle": 19043, "direction": "Inbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Inbound"}, {"lat": 49.28608322143555, "lng": -123.11848449707031, "route": "37807", "vehicle": 19044, "direction": "Outbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Outbound"}, {"lat": 49.28596878051758, "lng": -123.11882019042969, "route": "37807", "vehicle": 19021, "direction": "Outbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281463623046875, lng: -123.03197642735073 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

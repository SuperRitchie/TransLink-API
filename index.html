
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28131866455078, "lng": -123.07156372070312, "route": "37807", "vehicle": 22014, "direction": "Inbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.06639862060547, "route": "37807", "vehicle": 24011, "direction": "Inbound", "color": "green", "info": "Vehicle: 24011, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.064453125, "route": "37807", "vehicle": 9724, "direction": "Inbound", "color": "red", "info": "Vehicle: 9724, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.06123352050781, "route": "37807", "vehicle": 9778, "direction": "Inbound", "color": "red", "info": "Vehicle: 9778, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.03189849853516, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.28099822998047, "lng": -123.00696563720703, "route": "37807", "vehicle": 19040, "direction": "Outbound", "color": "green", "info": "Vehicle: 19040, Route: 37807, Direction: Outbound"}, {"lat": 49.2802848815918, "lng": -122.97998046875, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.28031539916992, "lng": -122.96493530273438, "route": "37807", "vehicle": 19029, "direction": "Outbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Outbound"}, {"lat": 49.28030014038086, "lng": -122.96448516845703, "route": "37807", "vehicle": 23009, "direction": "Outbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Outbound"}, {"lat": 49.2822151184082, "lng": -123.10863494873047, "route": "37807", "vehicle": 19020, "direction": "Outbound", "color": "green", "info": "Vehicle: 19020, Route: 37807, Direction: Outbound"}, {"lat": 49.2814826965332, "lng": -123.10115051269531, "route": "37807", "vehicle": 24012, "direction": "Outbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Outbound"}, {"lat": 49.281349182128906, "lng": -123.10003662109375, "route": "37807", "vehicle": 22003, "direction": "Outbound", "color": "green", "info": "Vehicle: 22003, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.08763122558594, "route": "37807", "vehicle": 19031, "direction": "Outbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.02729797363281, "route": "37807", "vehicle": 19015, "direction": "Inbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Inbound"}, {"lat": 49.278167724609375, "lng": -122.92070007324219, "route": "37807", "vehicle": 22012, "direction": "Inbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91276550292969, "route": "37807", "vehicle": 19047, "direction": "Inbound", "color": "green", "info": "Vehicle: 19047, Route: 37807, Direction: Inbound"}, {"lat": 49.28044891357422, "lng": -122.9697494506836, "route": "37807", "vehicle": 19021, "direction": "Inbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Inbound"}, {"lat": 49.28561782836914, "lng": -123.11446380615234, "route": "37807", "vehicle": 19026, "direction": "Inbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Inbound"}, {"lat": 49.28703308105469, "lng": -123.11714935302734, "route": "37807", "vehicle": 15009, "direction": "Inbound", "color": "red", "info": "Vehicle: 15009, Route: 37807, Direction: Inbound"}, {"lat": 49.285831451416016, "lng": -123.1187515258789, "route": "37807", "vehicle": 23007, "direction": "Outbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Outbound"}, {"lat": 49.2863655090332, "lng": -123.11578369140625, "route": "37807", "vehicle": 19033, "direction": "Outbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Outbound"}, {"lat": 49.28609848022461, "lng": -123.1183853149414, "route": "37807", "vehicle": 22008, "direction": "Outbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Outbound"}, {"lat": 49.28533172607422, "lng": -123.11956787109375, "route": "37807", "vehicle": 19007, "direction": "Outbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Outbound"}, {"lat": 49.28654861450195, "lng": -123.11766815185547, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.00408172607422, "route": "37807", "vehicle": 19037, "direction": "Inbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28225646972656, lng: -123.05062927246094 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

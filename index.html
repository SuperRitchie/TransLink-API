
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28108215332031, "lng": -123.08343505859375, "route": "37807", "vehicle": 8146, "direction": "Inbound", "color": "red", "info": "Vehicle: 8146, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.05590057373047, "route": "37807", "vehicle": 19016, "direction": "Outbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Outbound"}, {"lat": 49.2811164855957, "lng": -123.05121612548828, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.03276824951172, "route": "37807", "vehicle": 23001, "direction": "Inbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Inbound"}, {"lat": 49.2810173034668, "lng": -123.01678466796875, "route": "37807", "vehicle": 15012, "direction": "Outbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Outbound"}, {"lat": 49.28071594238281, "lng": -122.99346923828125, "route": "37807", "vehicle": 23003, "direction": "Outbound", "color": "green", "info": "Vehicle: 23003, Route: 37807, Direction: Outbound"}, {"lat": 49.28026580810547, "lng": -122.97956848144531, "route": "37807", "vehicle": 24004, "direction": "Outbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Outbound"}, {"lat": 49.278831481933594, "lng": -122.91230010986328, "route": "37807", "vehicle": 18032, "direction": "Outbound", "color": "green", "info": "Vehicle: 18032, Route: 37807, Direction: Outbound"}, {"lat": 49.27866744995117, "lng": -122.93363189697266, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.281768798828125, "lng": -123.10565185546875, "route": "37807", "vehicle": 24005, "direction": "Outbound", "color": "green", "info": "Vehicle: 24005, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.09788513183594, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.281349182128906, "lng": -123.09828186035156, "route": "37807", "vehicle": 9649, "direction": "Outbound", "color": "red", "info": "Vehicle: 9649, Route: 37807, Direction: Outbound"}, {"lat": 49.278499603271484, "lng": -122.91278076171875, "route": "37807", "vehicle": 8147, "direction": "Inbound", "color": "red", "info": "Vehicle: 8147, Route: 37807, Direction: Inbound"}, {"lat": 49.27858352661133, "lng": -122.91238403320312, "route": "37807", "vehicle": 19036, "direction": "Inbound", "color": "green", "info": "Vehicle: 19036, Route: 37807, Direction: Inbound"}, {"lat": 49.27878189086914, "lng": -122.91231536865234, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.280418395996094, "lng": -122.9656982421875, "route": "37807", "vehicle": 16219, "direction": "Inbound", "color": "red", "info": "Vehicle: 16219, Route: 37807, Direction: Inbound"}, {"lat": 49.2856330871582, "lng": -123.11888122558594, "route": "37807", "vehicle": 19046, "direction": "Inbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Inbound"}, {"lat": 49.28541564941406, "lng": -123.11966705322266, "route": "37807", "vehicle": 22001, "direction": "Inbound", "color": "green", "info": "Vehicle: 22001, Route: 37807, Direction: Inbound"}, {"lat": 49.28205108642578, "lng": -123.10711669921875, "route": "37807", "vehicle": 16224, "direction": "Inbound", "color": "red", "info": "Vehicle: 16224, Route: 37807, Direction: Inbound"}, {"lat": 49.28386688232422, "lng": -123.11157989501953, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.2863655090332, "lng": -123.11840057373047, "route": "37807", "vehicle": 21025, "direction": "Outbound", "color": "green", "info": "Vehicle: 21025, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.01055145263672, "route": "37807", "vehicle": 8156, "direction": "Inbound", "color": "red", "info": "Vehicle: 8156, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.0054702758789, "route": "37807", "vehicle": 24007, "direction": "Inbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.04550170898438, "route": "37807", "vehicle": 19014, "direction": "Inbound", "color": "green", "info": "Vehicle: 19014, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.038330078125, "route": "37807", "vehicle": 9619, "direction": "Outbound", "color": "red", "info": "Vehicle: 9619, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28129974365234, lng: -123.02958282470703 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

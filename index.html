
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28123474121094, "lng": -123.05706787109375, "route": "37807", "vehicle": 22003, "direction": "Inbound", "color": "green", "info": "Vehicle: 22003, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.03746795654297, "route": "37807", "vehicle": 19029, "direction": "Outbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.05619812011719, "route": "37807", "vehicle": 19042, "direction": "Inbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Inbound"}, {"lat": 49.280967712402344, "lng": -123.00496673583984, "route": "37807", "vehicle": 23013, "direction": "Outbound", "color": "green", "info": "Vehicle: 23013, Route: 37807, Direction: Outbound"}, {"lat": 49.28033447265625, "lng": -122.96488189697266, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}, {"lat": 49.2735481262207, "lng": -122.92611694335938, "route": "37807", "vehicle": 23002, "direction": "Outbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Outbound"}, {"lat": 49.27711868286133, "lng": -122.94523620605469, "route": "37807", "vehicle": 19016, "direction": "Inbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Inbound"}, {"lat": 49.281166076660156, "lng": -123.0708999633789, "route": "37807", "vehicle": 24012, "direction": "Outbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.02891540527344, "route": "37807", "vehicle": 19035, "direction": "Inbound", "color": "green", "info": "Vehicle: 19035, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 23009, "direction": "Inbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Inbound"}, {"lat": 49.27788162231445, "lng": -122.90975189208984, "route": "37807", "vehicle": 24010, "direction": "Inbound", "color": "green", "info": "Vehicle: 24010, Route: 37807, Direction: Inbound"}, {"lat": 49.275184631347656, "lng": -122.9289321899414, "route": "37807", "vehicle": 9781, "direction": "Inbound", "color": "red", "info": "Vehicle: 9781, Route: 37807, Direction: Inbound"}, {"lat": 49.2850341796875, "lng": -123.1139144897461, "route": "37807", "vehicle": 24016, "direction": "Outbound", "color": "green", "info": "Vehicle: 24016, Route: 37807, Direction: Outbound"}, {"lat": 49.2855339050293, "lng": -123.11544799804688, "route": "37807", "vehicle": 19008, "direction": "Inbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Inbound"}, {"lat": 49.28578186035156, "lng": -123.1135482788086, "route": "37807", "vehicle": 9614, "direction": "Inbound", "color": "red", "info": "Vehicle: 9614, Route: 37807, Direction: Inbound"}, {"lat": 49.28609848022461, "lng": -123.11885070800781, "route": "37807", "vehicle": 22005, "direction": "Outbound", "color": "green", "info": "Vehicle: 22005, Route: 37807, Direction: Outbound"}, {"lat": 49.286617279052734, "lng": -123.11761474609375, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.00263214111328, "route": "37807", "vehicle": 15019, "direction": "Inbound", "color": "red", "info": "Vehicle: 15019, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281086179945206, lng: -123.0236218770345 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

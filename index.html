
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281333923339844, "lng": -123.07113647460938, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.28128433227539, "lng": -123.06988525390625, "route": "37807", "vehicle": 19031, "direction": "Inbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.04713439941406, "route": "37807", "vehicle": 19008, "direction": "Outbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Outbound"}, {"lat": 49.28099822998047, "lng": -123.01293182373047, "route": "37807", "vehicle": 24015, "direction": "Outbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Outbound"}, {"lat": 49.28034973144531, "lng": -122.95453643798828, "route": "37807", "vehicle": 22012, "direction": "Outbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Outbound"}, {"lat": 49.28034973144531, "lng": -122.95207977294922, "route": "37807", "vehicle": 19007, "direction": "Outbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Outbound"}, {"lat": 49.2807502746582, "lng": -122.91666412353516, "route": "37807", "vehicle": 16221, "direction": "Outbound", "color": "red", "info": "Vehicle: 16221, Route: 37807, Direction: Outbound"}, {"lat": 49.280433654785156, "lng": -122.95411682128906, "route": "37807", "vehicle": 19030, "direction": "Inbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.98175048828125, "route": "37807", "vehicle": 8145, "direction": "Inbound", "color": "red", "info": "Vehicle: 8145, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.0983657836914, "route": "37807", "vehicle": 19043, "direction": "Outbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.06693267822266, "route": "37807", "vehicle": 16203, "direction": "Outbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Outbound"}, {"lat": 49.281150817871094, "lng": -123.02960205078125, "route": "37807", "vehicle": 19032, "direction": "Inbound", "color": "green", "info": "Vehicle: 19032, Route: 37807, Direction: Inbound"}, {"lat": 49.27909851074219, "lng": -122.9111328125, "route": "37807", "vehicle": 16223, "direction": "Inbound", "color": "red", "info": "Vehicle: 16223, Route: 37807, Direction: Inbound"}, {"lat": 49.27859878540039, "lng": -122.91238403320312, "route": "37807", "vehicle": 16201, "direction": "Inbound", "color": "red", "info": "Vehicle: 16201, Route: 37807, Direction: Inbound"}, {"lat": 49.27799987792969, "lng": -122.91033172607422, "route": "37807", "vehicle": 24013, "direction": "Inbound", "color": "green", "info": "Vehicle: 24013, Route: 37807, Direction: Inbound"}, {"lat": 49.28219985961914, "lng": -123.10908508300781, "route": "37807", "vehicle": 16226, "direction": "Outbound", "color": "red", "info": "Vehicle: 16226, Route: 37807, Direction: Outbound"}, {"lat": 49.28213119506836, "lng": -123.10884857177734, "route": "37807", "vehicle": 9738, "direction": "Outbound", "color": "red", "info": "Vehicle: 9738, Route: 37807, Direction: Outbound"}, {"lat": 49.28561782836914, "lng": -123.11541748046875, "route": "37807", "vehicle": 19016, "direction": "Inbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Inbound"}, {"lat": 49.283748626708984, "lng": -123.1201171875, "route": "37807", "vehicle": 23014, "direction": "Inbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Inbound"}, {"lat": 49.28273391723633, "lng": -123.1097183227539, "route": "37807", "vehicle": 22010, "direction": "Inbound", "color": "green", "info": "Vehicle: 22010, Route: 37807, Direction: Inbound"}, {"lat": 49.28598403930664, "lng": -123.11883544921875, "route": "37807", "vehicle": 22014, "direction": "Outbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Outbound"}, {"lat": 49.28708267211914, "lng": -123.11705017089844, "route": "37807", "vehicle": 8144, "direction": "Outbound", "color": "red", "info": "Vehicle: 8144, Route: 37807, Direction: Outbound"}, {"lat": 49.28609848022461, "lng": -123.11837005615234, "route": "37807", "vehicle": 9655, "direction": "Outbound", "color": "red", "info": "Vehicle: 9655, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.01509857177734, "route": "37807", "vehicle": 19033, "direction": "Inbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.03943634033203, "route": "37807", "vehicle": 8156, "direction": "Outbound", "color": "red", "info": "Vehicle: 8156, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28175979614258, lng: -123.0344384765625 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

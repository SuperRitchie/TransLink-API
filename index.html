
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281349182128906, "lng": -123.09976959228516, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.05753326416016, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.281131744384766, "lng": -123.05538177490234, "route": "37807", "vehicle": 19032, "direction": "Outbound", "color": "green", "info": "Vehicle: 19032, Route: 37807, Direction: Outbound"}, {"lat": 49.28004837036133, "lng": -122.99109649658203, "route": "37807", "vehicle": 9645, "direction": "Outbound", "color": "red", "info": "Vehicle: 9645, Route: 37807, Direction: Outbound"}, {"lat": 49.27973175048828, "lng": -122.95333099365234, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.27538299560547, "lng": -122.9291000366211, "route": "37807", "vehicle": 19022, "direction": "Outbound", "color": "green", "info": "Vehicle: 19022, Route: 37807, Direction: Outbound"}, {"lat": 49.276283264160156, "lng": -122.9441146850586, "route": "37807", "vehicle": 23012, "direction": "Outbound", "color": "green", "info": "Vehicle: 23012, Route: 37807, Direction: Outbound"}, {"lat": 49.27730178833008, "lng": -122.94561767578125, "route": "37807", "vehicle": 9786, "direction": "Inbound", "color": "red", "info": "Vehicle: 9786, Route: 37807, Direction: Inbound"}, {"lat": 49.28063201904297, "lng": -122.92247009277344, "route": "37807", "vehicle": 24002, "direction": "Inbound", "color": "green", "info": "Vehicle: 24002, Route: 37807, Direction: Inbound"}, {"lat": 49.2802848815918, "lng": -122.92093658447266, "route": "37807", "vehicle": 19013, "direction": "Inbound", "color": "green", "info": "Vehicle: 19013, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.09651947021484, "route": "37807", "vehicle": 19015, "direction": "Outbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Outbound"}, {"lat": 49.281150817871094, "lng": -123.06289672851562, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.27806854248047, "lng": -122.91091918945312, "route": "37807", "vehicle": 19027, "direction": "Inbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Inbound"}, {"lat": 49.28034973144531, "lng": -122.95986938476562, "route": "37807", "vehicle": 23009, "direction": "Inbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Inbound"}, {"lat": 49.28424835205078, "lng": -123.11209869384766, "route": "37807", "vehicle": 19019, "direction": "Inbound", "color": "green", "info": "Vehicle: 19019, Route: 37807, Direction: Inbound"}, {"lat": 49.28483200073242, "lng": -123.11248016357422, "route": "37807", "vehicle": 23013, "direction": "Inbound", "color": "green", "info": "Vehicle: 23013, Route: 37807, Direction: Inbound"}, {"lat": 49.281898498535156, "lng": -123.10693359375, "route": "37807", "vehicle": 23014, "direction": "Inbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Inbound"}, {"lat": 49.286067962646484, "lng": -123.1182632446289, "route": "37807", "vehicle": 19012, "direction": "Outbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.01748657226562, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28064968711451, lng: -123.01667464406867 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

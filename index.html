
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281333923339844, "lng": -123.09598541259766, "route": "37807", "vehicle": 9784, "direction": "Inbound", "color": "red", "info": "Vehicle: 9784, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.02153015136719, "route": "37807", "vehicle": 19031, "direction": "Outbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Outbound"}, {"lat": 49.275733947753906, "lng": -123.02339935302734, "route": "37807", "vehicle": 19043, "direction": "Inbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Inbound"}, {"lat": 49.280948638916016, "lng": -123.02338409423828, "route": "37807", "vehicle": 9734, "direction": "Inbound", "color": "red", "info": "Vehicle: 9734, Route: 37807, Direction: Inbound"}, {"lat": 49.27906799316406, "lng": -122.94873046875, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.27691650390625, "lng": -122.92555236816406, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}, {"lat": 49.27998352050781, "lng": -122.91996765136719, "route": "37807", "vehicle": 24014, "direction": "Outbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.08596801757812, "route": "37807", "vehicle": 23003, "direction": "Outbound", "color": "green", "info": "Vehicle: 23003, Route: 37807, Direction: Outbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 23006, "direction": "Inbound", "color": "green", "info": "Vehicle: 23006, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.96583557128906, "route": "37807", "vehicle": 19046, "direction": "Inbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Inbound"}, {"lat": 49.285484313964844, "lng": -123.11426544189453, "route": "37807", "vehicle": 19040, "direction": "Outbound", "color": "green", "info": "Vehicle: 19040, Route: 37807, Direction: Outbound"}, {"lat": 49.285118103027344, "lng": -123.1137466430664, "route": "37807", "vehicle": 19033, "direction": "Inbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.04913330078125, "route": "37807", "vehicle": 15012, "direction": "Inbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28052872877855, lng: -123.0154037475586 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

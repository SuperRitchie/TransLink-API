
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281166076660156, "lng": -123.08806610107422, "route": "37807", "vehicle": 16220, "direction": "Inbound", "color": "red", "info": "Vehicle: 16220, Route: 37807, Direction: Inbound"}, {"lat": 49.28126525878906, "lng": -123.06890106201172, "route": "37807", "vehicle": 16218, "direction": "Inbound", "color": "red", "info": "Vehicle: 16218, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.05606842041016, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.28103256225586, "lng": -123.03185272216797, "route": "37807", "vehicle": 19035, "direction": "Outbound", "color": "green", "info": "Vehicle: 19035, Route: 37807, Direction: Outbound"}, {"lat": 49.280967712402344, "lng": -122.9988021850586, "route": "37807", "vehicle": 22004, "direction": "Outbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Outbound"}, {"lat": 49.2735481262207, "lng": -122.9260025024414, "route": "37807", "vehicle": 19022, "direction": "Outbound", "color": "green", "info": "Vehicle: 19022, Route: 37807, Direction: Outbound"}, {"lat": 49.28030014038086, "lng": -122.95255279541016, "route": "37807", "vehicle": 23012, "direction": "Outbound", "color": "green", "info": "Vehicle: 23012, Route: 37807, Direction: Outbound"}, {"lat": 49.280399322509766, "lng": -122.97492980957031, "route": "37807", "vehicle": 23008, "direction": "Inbound", "color": "green", "info": "Vehicle: 23008, Route: 37807, Direction: Inbound"}, {"lat": 49.28131866455078, "lng": -123.10016632080078, "route": "37807", "vehicle": 19029, "direction": "Outbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.02803039550781, "route": "37807", "vehicle": 23014, "direction": "Inbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Inbound"}, {"lat": 49.27808380126953, "lng": -122.91104888916016, "route": "37807", "vehicle": 24015, "direction": "Inbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Inbound"}, {"lat": 49.278568267822266, "lng": -122.91239929199219, "route": "37807", "vehicle": 23009, "direction": "Inbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Inbound"}, {"lat": 49.277950286865234, "lng": -122.92070007324219, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.28431701660156, "lng": -123.11756896972656, "route": "37807", "vehicle": 19012, "direction": "Inbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Inbound"}, {"lat": 49.284549713134766, "lng": -123.1177978515625, "route": "37807", "vehicle": 8122, "direction": "Inbound", "color": "red", "info": "Vehicle: 8122, Route: 37807, Direction: Inbound"}, {"lat": 49.285518646240234, "lng": -123.1141357421875, "route": "37807", "vehicle": 19018, "direction": "Outbound", "color": "green", "info": "Vehicle: 19018, Route: 37807, Direction: Outbound"}, {"lat": 49.285850524902344, "lng": -123.11858367919922, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.28633117675781, "lng": -123.11849975585938, "route": "37807", "vehicle": 8156, "direction": "Outbound", "color": "red", "info": "Vehicle: 8156, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.00381469726562, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281292162443464, lng: -123.02946954024465 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

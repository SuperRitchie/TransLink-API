
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28165054321289, "lng": -123.1052474975586, "route": "37807", "vehicle": 19020, "direction": "Inbound", "color": "green", "info": "Vehicle: 19020, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.09413146972656, "route": "37807", "vehicle": 19025, "direction": "Inbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.04996490478516, "route": "37807", "vehicle": 22001, "direction": "Outbound", "color": "green", "info": "Vehicle: 22001, Route: 37807, Direction: Outbound"}, {"lat": 49.2810173034668, "lng": -123.02423095703125, "route": "37807", "vehicle": 9662, "direction": "Outbound", "color": "red", "info": "Vehicle: 9662, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.03185272216797, "route": "37807", "vehicle": 23001, "direction": "Outbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Outbound"}, {"lat": 49.2810173034668, "lng": -123.01316833496094, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.27986526489258, "lng": -122.91992950439453, "route": "37807", "vehicle": 19008, "direction": "Outbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Outbound"}, {"lat": 49.2813835144043, "lng": -123.1039810180664, "route": "37807", "vehicle": 16226, "direction": "Outbound", "color": "red", "info": "Vehicle: 16226, Route: 37807, Direction: Outbound"}, {"lat": 49.28125, "lng": -123.09728240966797, "route": "37807", "vehicle": 19016, "direction": "Outbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.06168365478516, "route": "37807", "vehicle": 19012, "direction": "Outbound", "color": "green", "info": "Vehicle: 19012, Route: 37807, Direction: Outbound"}, {"lat": 49.278099060058594, "lng": -122.91120147705078, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.28044891357422, "lng": -122.97008514404297, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}, {"lat": 49.28608322143555, "lng": -123.11869812011719, "route": "37807", "vehicle": 19034, "direction": "Outbound", "color": "green", "info": "Vehicle: 19034, Route: 37807, Direction: Outbound"}, {"lat": 49.281150817871094, "lng": -123.02207946777344, "route": "37807", "vehicle": 19027, "direction": "Inbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.05425262451172, "route": "37807", "vehicle": 24006, "direction": "Inbound", "color": "green", "info": "Vehicle: 24006, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28118845621745, lng: -123.03851928710938 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

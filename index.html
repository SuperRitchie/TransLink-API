
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28110122680664, "lng": -123.08464813232422, "route": "37807", "vehicle": 24013, "direction": "Inbound", "color": "green", "info": "Vehicle: 24013, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.05591583251953, "route": "37807", "vehicle": 22008, "direction": "Outbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Outbound"}, {"lat": 49.280967712402344, "lng": -122.9968490600586, "route": "37807", "vehicle": 23002, "direction": "Outbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Outbound"}, {"lat": 49.28031539916992, "lng": -122.9886474609375, "route": "37807", "vehicle": 24003, "direction": "Outbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Outbound"}, {"lat": 49.2803840637207, "lng": -122.91809844970703, "route": "37807", "vehicle": 19023, "direction": "Outbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Outbound"}, {"lat": 49.280784606933594, "lng": -122.92288208007812, "route": "37807", "vehicle": 15012, "direction": "Inbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Inbound"}, {"lat": 49.282466888427734, "lng": -123.1086196899414, "route": "37807", "vehicle": 24016, "direction": "Outbound", "color": "green", "info": "Vehicle: 24016, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.02722930908203, "route": "37807", "vehicle": 19010, "direction": "Inbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Inbound"}, {"lat": 49.280582427978516, "lng": -122.95884704589844, "route": "37807", "vehicle": 18060, "direction": "Inbound", "color": "green", "info": "Vehicle: 18060, Route: 37807, Direction: Inbound"}, {"lat": 49.28200149536133, "lng": -123.1072006225586, "route": "37807", "vehicle": 23013, "direction": "Inbound", "color": "green", "info": "Vehicle: 23013, Route: 37807, Direction: Inbound"}, {"lat": 49.286048889160156, "lng": -123.11833190917969, "route": "37807", "vehicle": 24009, "direction": "Outbound", "color": "green", "info": "Vehicle: 24009, Route: 37807, Direction: Outbound"}, {"lat": 49.28575134277344, "lng": -123.11813354492188, "route": "37807", "vehicle": 23010, "direction": "Outbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.04859924316406, "route": "37807", "vehicle": 9630, "direction": "Inbound", "color": "red", "info": "Vehicle: 9630, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28183482243465, lng: -123.03492326002855 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

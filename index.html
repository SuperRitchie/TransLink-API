
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28131866455078, "lng": -123.07113647460938, "route": "37807", "vehicle": 16220, "direction": "Inbound", "color": "red", "info": "Vehicle: 16220, Route: 37807, Direction: Inbound"}, {"lat": 49.281131744384766, "lng": -123.0531997680664, "route": "37807", "vehicle": 24001, "direction": "Outbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Outbound"}, {"lat": 49.27913284301758, "lng": -122.92023468017578, "route": "37807", "vehicle": 23012, "direction": "Outbound", "color": "green", "info": "Vehicle: 23012, Route: 37807, Direction: Outbound"}, {"lat": 49.28105163574219, "lng": -122.99884796142578, "route": "37807", "vehicle": 19026, "direction": "Inbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Inbound"}, {"lat": 49.281131744384766, "lng": -123.06071472167969, "route": "37807", "vehicle": 19018, "direction": "Outbound", "color": "green", "info": "Vehicle: 19018, Route: 37807, Direction: Outbound"}, {"lat": 49.27669906616211, "lng": -122.90950012207031, "route": "37807", "vehicle": 16219, "direction": "Inbound", "color": "red", "info": "Vehicle: 16219, Route: 37807, Direction: Inbound"}, {"lat": 49.28238296508789, "lng": -123.10945129394531, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.2861328125, "lng": -123.11849975585938, "route": "37807", "vehicle": 19044, "direction": "Outbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Outbound"}, {"lat": 49.2811164855957, "lng": -123.01326751708984, "route": "37807", "vehicle": 19031, "direction": "Inbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281121995713974, lng: -123.02831692165799 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

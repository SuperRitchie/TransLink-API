
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28108215332031, "lng": -123.05591583251953, "route": "37807", "vehicle": 16218, "direction": "Outbound", "color": "red", "info": "Vehicle: 16218, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.04779815673828, "route": "37807", "vehicle": 24012, "direction": "Inbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Inbound"}, {"lat": 49.28099822998047, "lng": -123.01343536376953, "route": "37807", "vehicle": 19026, "direction": "Outbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Outbound"}, {"lat": 49.27378463745117, "lng": -122.92958068847656, "route": "37807", "vehicle": 23007, "direction": "Outbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Outbound"}, {"lat": 49.27906799316406, "lng": -122.91226959228516, "route": "37807", "vehicle": 24004, "direction": "Outbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Outbound"}, {"lat": 49.27861785888672, "lng": -122.91236877441406, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.27411651611328, "lng": -122.93551635742188, "route": "37807", "vehicle": 23004, "direction": "Inbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.0009536743164, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.0888671875, "route": "37807", "vehicle": 24015, "direction": "Outbound", "color": "green", "info": "Vehicle: 24015, Route: 37807, Direction: Outbound"}, {"lat": 49.28118133544922, "lng": -123.02539825439453, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91273498535156, "route": "37807", "vehicle": 16220, "direction": "Inbound", "color": "red", "info": "Vehicle: 16220, Route: 37807, Direction: Inbound"}, {"lat": 49.278350830078125, "lng": -122.92068481445312, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.28236770629883, "lng": -123.10906982421875, "route": "37807", "vehicle": 16222, "direction": "Outbound", "color": "red", "info": "Vehicle: 16222, Route: 37807, Direction: Outbound"}, {"lat": 49.285884857177734, "lng": -123.11479949951172, "route": "37807", "vehicle": 24016, "direction": "Inbound", "color": "green", "info": "Vehicle: 24016, Route: 37807, Direction: Inbound"}, {"lat": 49.282432556152344, "lng": -123.10918426513672, "route": "37807", "vehicle": 16203, "direction": "Inbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Inbound"}, {"lat": 49.28648376464844, "lng": -123.1185302734375, "route": "37807", "vehicle": 24006, "direction": "Outbound", "color": "green", "info": "Vehicle: 24006, Route: 37807, Direction: Outbound"}, {"lat": 49.28591537475586, "lng": -123.1185302734375, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28071190329159, lng: -123.0191551657284 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

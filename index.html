
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281131744384766, "lng": -123.08646392822266, "route": "37807", "vehicle": 19029, "direction": "Inbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.05268096923828, "route": "37807", "vehicle": 19019, "direction": "Outbound", "color": "green", "info": "Vehicle: 19019, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.02828216552734, "route": "37807", "vehicle": 19033, "direction": "Outbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Outbound"}, {"lat": 49.277034759521484, "lng": -122.92680358886719, "route": "37807", "vehicle": 24002, "direction": "Outbound", "color": "green", "info": "Vehicle: 24002, Route: 37807, Direction: Outbound"}, {"lat": 49.280765533447266, "lng": -122.9164810180664, "route": "37807", "vehicle": 24016, "direction": "Outbound", "color": "green", "info": "Vehicle: 24016, Route: 37807, Direction: Outbound"}, {"lat": 49.280399322509766, "lng": -122.9818344116211, "route": "37807", "vehicle": 23014, "direction": "Inbound", "color": "green", "info": "Vehicle: 23014, Route: 37807, Direction: Inbound"}, {"lat": 49.285667419433594, "lng": -123.11443328857422, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.28541564941406, "lng": -123.1183853149414, "route": "37807", "vehicle": 19039, "direction": "Outbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Outbound"}, {"lat": 49.28638458251953, "lng": -123.1185531616211, "route": "37807", "vehicle": 23010, "direction": "Outbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.282112969292534, lng: -123.03821309407552 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

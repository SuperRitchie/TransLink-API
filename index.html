
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.2813835144043, "lng": -123.09911346435547, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.01188659667969, "route": "37807", "vehicle": 19017, "direction": "Outbound", "color": "green", "info": "Vehicle: 19017, Route: 37807, Direction: Outbound"}, {"lat": 49.280982971191406, "lng": -123.006103515625, "route": "37807", "vehicle": 16221, "direction": "Outbound", "color": "red", "info": "Vehicle: 16221, Route: 37807, Direction: Outbound"}, {"lat": 49.28083419799805, "lng": -123.02333068847656, "route": "37807", "vehicle": 9772, "direction": "Inbound", "color": "red", "info": "Vehicle: 9772, Route: 37807, Direction: Inbound"}, {"lat": 49.28036880493164, "lng": -122.95719909667969, "route": "37807", "vehicle": 19026, "direction": "Outbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Outbound"}, {"lat": 49.28049850463867, "lng": -122.93038177490234, "route": "37807", "vehicle": 15018, "direction": "Inbound", "color": "red", "info": "Vehicle: 15018, Route: 37807, Direction: Inbound"}, {"lat": 49.28105163574219, "lng": -123.00093078613281, "route": "37807", "vehicle": 19033, "direction": "Inbound", "color": "green", "info": "Vehicle: 19033, Route: 37807, Direction: Inbound"}, {"lat": 49.28093338012695, "lng": -123.08056640625, "route": "37807", "vehicle": 19028, "direction": "Outbound", "color": "green", "info": "Vehicle: 19028, Route: 37807, Direction: Outbound"}, {"lat": 49.27854919433594, "lng": -122.9127197265625, "route": "37807", "vehicle": 19029, "direction": "Inbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Inbound"}, {"lat": 49.28426742553711, "lng": -123.1122817993164, "route": "37807", "vehicle": 19021, "direction": "Inbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Inbound"}, {"lat": 49.2859001159668, "lng": -123.11876678466797, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.28704833984375, "lng": -123.11717987060547, "route": "37807", "vehicle": 19044, "direction": "Outbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.01373291015625, "route": "37807", "vehicle": 18042, "direction": "Inbound", "color": "green", "info": "Vehicle: 18042, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281840984637924, lng: -123.02955334003155 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

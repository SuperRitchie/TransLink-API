
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28126525878906, "lng": -123.06503295898438, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.0555191040039, "route": "37807", "vehicle": 16221, "direction": "Outbound", "color": "red", "info": "Vehicle: 16221, Route: 37807, Direction: Outbound"}, {"lat": 49.280967712402344, "lng": -123.0052490234375, "route": "37807", "vehicle": 23011, "direction": "Outbound", "color": "green", "info": "Vehicle: 23011, Route: 37807, Direction: Outbound"}, {"lat": 49.28066635131836, "lng": -122.92987060546875, "route": "37807", "vehicle": 19019, "direction": "Inbound", "color": "green", "info": "Vehicle: 19019, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.00281524658203, "route": "37807", "vehicle": 19027, "direction": "Inbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Inbound"}, {"lat": 49.27843475341797, "lng": -122.9124526977539, "route": "37807", "vehicle": 19044, "direction": "Inbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Inbound"}, {"lat": 49.28348159790039, "lng": -123.11111450195312, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}, {"lat": 49.284915924072266, "lng": -123.11830139160156, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.286033630371094, "lng": -123.11821746826172, "route": "37807", "vehicle": 19010, "direction": "Outbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28199810451932, lng: -123.03539699978299 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

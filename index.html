
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.281368255615234, "lng": -123.09803009033203, "route": "37807", "vehicle": 8146, "direction": "Inbound", "color": "red", "info": "Vehicle: 8146, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.05924987792969, "route": "37807", "vehicle": 19014, "direction": "Inbound", "color": "green", "info": "Vehicle: 19014, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.06806945800781, "route": "37807", "vehicle": 23001, "direction": "Inbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.04817962646484, "route": "37807", "vehicle": 19016, "direction": "Outbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.03575134277344, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28099822998047, "lng": -123.00755310058594, "route": "37807", "vehicle": 15012, "direction": "Outbound", "color": "red", "info": "Vehicle: 15012, Route: 37807, Direction: Outbound"}, {"lat": 49.28026580810547, "lng": -122.9795150756836, "route": "37807", "vehicle": 24004, "direction": "Outbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Outbound"}, {"lat": 49.27516555786133, "lng": -122.94041442871094, "route": "37807", "vehicle": 19023, "direction": "Inbound", "color": "green", "info": "Vehicle: 19023, Route: 37807, Direction: Inbound"}, {"lat": 49.28165054321289, "lng": -123.10449981689453, "route": "37807", "vehicle": 21025, "direction": "Outbound", "color": "green", "info": "Vehicle: 21025, Route: 37807, Direction: Outbound"}, {"lat": 49.28126525878906, "lng": -123.07779693603516, "route": "37807", "vehicle": 22001, "direction": "Outbound", "color": "green", "info": "Vehicle: 22001, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.06649780273438, "route": "37807", "vehicle": 24005, "direction": "Outbound", "color": "green", "info": "Vehicle: 24005, Route: 37807, Direction: Outbound"}, {"lat": 49.278499603271484, "lng": -122.91278076171875, "route": "37807", "vehicle": 8147, "direction": "Inbound", "color": "red", "info": "Vehicle: 8147, Route: 37807, Direction: Inbound"}, {"lat": 49.27843475341797, "lng": -122.9124526977539, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.27906799316406, "lng": -122.91224670410156, "route": "37807", "vehicle": 18032, "direction": "Inbound", "color": "green", "info": "Vehicle: 18032, Route: 37807, Direction: Inbound"}, {"lat": 49.28463363647461, "lng": -123.1128158569336, "route": "37807", "vehicle": 9619, "direction": "Inbound", "color": "red", "info": "Vehicle: 9619, Route: 37807, Direction: Inbound"}, {"lat": 49.2857666015625, "lng": -123.11849975585938, "route": "37807", "vehicle": 16224, "direction": "Outbound", "color": "red", "info": "Vehicle: 16224, Route: 37807, Direction: Outbound"}, {"lat": 49.28671646118164, "lng": -123.11698150634766, "route": "37807", "vehicle": 19046, "direction": "Outbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Outbound"}, {"lat": 49.28668212890625, "lng": -123.11616516113281, "route": "37807", "vehicle": 19041, "direction": "Outbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Outbound"}, {"lat": 49.28110122680664, "lng": -123.0159683227539, "route": "37807", "vehicle": 24007, "direction": "Inbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Inbound"}, {"lat": 49.28120040893555, "lng": -123.05168151855469, "route": "37807", "vehicle": 8156, "direction": "Inbound", "color": "red", "info": "Vehicle: 8156, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281430053710935, lng: -123.03775749206542 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

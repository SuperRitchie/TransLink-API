
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28141784667969, "lng": -123.09929656982422, "route": "37807", "vehicle": 19021, "direction": "Inbound", "color": "green", "info": "Vehicle: 19021, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.08432006835938, "route": "37807", "vehicle": 24008, "direction": "Inbound", "color": "green", "info": "Vehicle: 24008, Route: 37807, Direction: Inbound"}, {"lat": 49.281333923339844, "lng": -123.07403564453125, "route": "37807", "vehicle": 9799, "direction": "Inbound", "color": "red", "info": "Vehicle: 9799, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.06493377685547, "route": "37807", "vehicle": 19041, "direction": "Inbound", "color": "green", "info": "Vehicle: 19041, Route: 37807, Direction: Inbound"}, {"lat": 49.28128433227539, "lng": -123.06900024414062, "route": "37807", "vehicle": 9617, "direction": "Inbound", "color": "red", "info": "Vehicle: 9617, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.04438018798828, "route": "37807", "vehicle": 24003, "direction": "Outbound", "color": "green", "info": "Vehicle: 24003, Route: 37807, Direction: Outbound"}, {"lat": 49.280982971191406, "lng": -123.01301574707031, "route": "37807", "vehicle": 19029, "direction": "Outbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Outbound"}, {"lat": 49.280948638916016, "lng": -123.0045166015625, "route": "37807", "vehicle": 8145, "direction": "Outbound", "color": "red", "info": "Vehicle: 8145, Route: 37807, Direction: Outbound"}, {"lat": 49.27506637573242, "lng": -122.94048309326172, "route": "37807", "vehicle": 24004, "direction": "Outbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Outbound"}, {"lat": 49.28131866455078, "lng": -122.92693328857422, "route": "37807", "vehicle": 19043, "direction": "Inbound", "color": "green", "info": "Vehicle: 19043, Route: 37807, Direction: Inbound"}, {"lat": 49.28131866455078, "lng": -123.0992660522461, "route": "37807", "vehicle": 23007, "direction": "Outbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Outbound"}, {"lat": 49.281150817871094, "lng": -123.07093048095703, "route": "37807", "vehicle": 22001, "direction": "Outbound", "color": "green", "info": "Vehicle: 22001, Route: 37807, Direction: Outbound"}, {"lat": 49.27241516113281, "lng": -123.0215835571289, "route": "37807", "vehicle": 19037, "direction": "Inbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Inbound"}, {"lat": 49.27841567993164, "lng": -122.9124526977539, "route": "37807", "vehicle": 19010, "direction": "Inbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Inbound"}, {"lat": 49.27859878540039, "lng": -122.91238403320312, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.278533935546875, "lng": -122.91276550292969, "route": "37807", "vehicle": 22012, "direction": "Inbound", "color": "green", "info": "Vehicle: 22012, Route: 37807, Direction: Inbound"}, {"lat": 49.28044891357422, "lng": -122.95846557617188, "route": "37807", "vehicle": 15018, "direction": "Inbound", "color": "red", "info": "Vehicle: 15018, Route: 37807, Direction: Inbound"}, {"lat": 49.28373336791992, "lng": -123.11018371582031, "route": "37807", "vehicle": 22008, "direction": "Outbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Outbound"}, {"lat": 49.285518646240234, "lng": -123.11927032470703, "route": "37807", "vehicle": 19024, "direction": "Inbound", "color": "green", "info": "Vehicle: 19024, Route: 37807, Direction: Inbound"}, {"lat": 49.28596878051758, "lng": -123.1185531616211, "route": "37807", "vehicle": 19015, "direction": "Outbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Outbound"}, {"lat": 49.28651809692383, "lng": -123.11786651611328, "route": "37807", "vehicle": 8146, "direction": "Outbound", "color": "red", "info": "Vehicle: 8146, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28087252662296, lng: -123.03212556384858 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

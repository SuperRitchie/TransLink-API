
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28141784667969, "lng": -123.09976959228516, "route": "37807", "vehicle": 19034, "direction": "Inbound", "color": "green", "info": "Vehicle: 19034, Route: 37807, Direction: Inbound"}, {"lat": 49.281333923339844, "lng": -123.07147979736328, "route": "37807", "vehicle": 23004, "direction": "Inbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Inbound"}, {"lat": 49.28121566772461, "lng": -123.09140014648438, "route": "37807", "vehicle": 8156, "direction": "Inbound", "color": "red", "info": "Vehicle: 8156, Route: 37807, Direction: Inbound"}, {"lat": 49.28118133544922, "lng": -123.0886001586914, "route": "37807", "vehicle": 22007, "direction": "Inbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.0469970703125, "route": "37807", "vehicle": 24004, "direction": "Outbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Outbound"}, {"lat": 49.280982971191406, "lng": -123.00035095214844, "route": "37807", "vehicle": 24001, "direction": "Outbound", "color": "green", "info": "Vehicle: 24001, Route: 37807, Direction: Outbound"}, {"lat": 49.28099822998047, "lng": -123.01439666748047, "route": "37807", "vehicle": 9625, "direction": "Outbound", "color": "red", "info": "Vehicle: 9625, Route: 37807, Direction: Outbound"}, {"lat": 49.28026580810547, "lng": -122.96881866455078, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.27634811401367, "lng": -122.94398498535156, "route": "37807", "vehicle": 24007, "direction": "Inbound", "color": "green", "info": "Vehicle: 24007, Route: 37807, Direction: Inbound"}, {"lat": 49.27993392944336, "lng": -122.92021942138672, "route": "37807", "vehicle": 9783, "direction": "Inbound", "color": "red", "info": "Vehicle: 9783, Route: 37807, Direction: Inbound"}, {"lat": 49.28031539916992, "lng": -122.99031829833984, "route": "37807", "vehicle": 19037, "direction": "Inbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Inbound"}, {"lat": 49.28110122680664, "lng": -123.00344848632812, "route": "37807", "vehicle": 24011, "direction": "Inbound", "color": "green", "info": "Vehicle: 24011, Route: 37807, Direction: Inbound"}, {"lat": 49.281131744384766, "lng": -123.0898666381836, "route": "37807", "vehicle": 24010, "direction": "Outbound", "color": "green", "info": "Vehicle: 24010, Route: 37807, Direction: Outbound"}, {"lat": 49.27909851074219, "lng": -122.91106414794922, "route": "37807", "vehicle": 22010, "direction": "Inbound", "color": "green", "info": "Vehicle: 22010, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.28431701660156, "lng": -123.1170654296875, "route": "37807", "vehicle": 22004, "direction": "Inbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Inbound"}, {"lat": 49.28654861450195, "lng": -123.11573028564453, "route": "37807", "vehicle": 19030, "direction": "Outbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.0544204711914, "route": "37807", "vehicle": 19008, "direction": "Inbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28094673156738, lng: -123.02448230319553 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28121566772461, "lng": -123.06261444091797, "route": "37807", "vehicle": 24012, "direction": "Inbound", "color": "green", "info": "Vehicle: 24012, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.03209686279297, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.28125, "lng": -123.03278350830078, "route": "37807", "vehicle": 22003, "direction": "Inbound", "color": "green", "info": "Vehicle: 22003, Route: 37807, Direction: Inbound"}, {"lat": 49.28030014038086, "lng": -122.97384643554688, "route": "37807", "vehicle": 19037, "direction": "Outbound", "color": "green", "info": "Vehicle: 19037, Route: 37807, Direction: Outbound"}, {"lat": 49.2803840637207, "lng": -122.98190307617188, "route": "37807", "vehicle": 19026, "direction": "Inbound", "color": "green", "info": "Vehicle: 19026, Route: 37807, Direction: Inbound"}, {"lat": 49.281333923339844, "lng": -123.10171508789062, "route": "37807", "vehicle": 22006, "direction": "Outbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Outbound"}, {"lat": 49.275516510009766, "lng": -122.91387939453125, "route": "37807", "vehicle": 24011, "direction": "Inbound", "color": "green", "info": "Vehicle: 24011, Route: 37807, Direction: Inbound"}, {"lat": 49.28335189819336, "lng": -123.11894989013672, "route": "37807", "vehicle": 15009, "direction": "Inbound", "color": "red", "info": "Vehicle: 15009, Route: 37807, Direction: Inbound"}, {"lat": 49.285133361816406, "lng": -123.11368560791016, "route": "37807", "vehicle": 19031, "direction": "Inbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.0422134399414, "route": "37807", "vehicle": 23009, "direction": "Outbound", "color": "green", "info": "Vehicle: 23009, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.04550170898438, "route": "37807", "vehicle": 19007, "direction": "Outbound", "color": "green", "info": "Vehicle: 19007, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28109394420277, lng: -123.03810813210227 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

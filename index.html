
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28131866455078, "lng": -123.07416534423828, "route": "37807", "vehicle": 9605, "direction": "Inbound", "color": "red", "info": "Vehicle: 9605, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.06298065185547, "route": "37807", "vehicle": 22008, "direction": "Inbound", "color": "green", "info": "Vehicle: 22008, Route: 37807, Direction: Inbound"}, {"lat": 49.28106689453125, "lng": -123.02501678466797, "route": "37807", "vehicle": 23002, "direction": "Outbound", "color": "green", "info": "Vehicle: 23002, Route: 37807, Direction: Outbound"}, {"lat": 49.280967712402344, "lng": -123.00433349609375, "route": "37807", "vehicle": 23010, "direction": "Outbound", "color": "green", "info": "Vehicle: 23010, Route: 37807, Direction: Outbound"}, {"lat": 49.275718688964844, "lng": -122.94304656982422, "route": "37807", "vehicle": 19013, "direction": "Outbound", "color": "green", "info": "Vehicle: 19013, Route: 37807, Direction: Outbound"}, {"lat": 49.27539825439453, "lng": -122.94210052490234, "route": "37807", "vehicle": 8144, "direction": "Outbound", "color": "red", "info": "Vehicle: 8144, Route: 37807, Direction: Outbound"}, {"lat": 49.28044891357422, "lng": -122.95396423339844, "route": "37807", "vehicle": 22013, "direction": "Inbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.00253295898438, "route": "37807", "vehicle": 19046, "direction": "Inbound", "color": "green", "info": "Vehicle: 19046, Route: 37807, Direction: Inbound"}, {"lat": 49.28123474121094, "lng": -123.07571411132812, "route": "37807", "vehicle": 8143, "direction": "Outbound", "color": "red", "info": "Vehicle: 8143, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.0311508178711, "route": "37807", "vehicle": 19031, "direction": "Inbound", "color": "green", "info": "Vehicle: 19031, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 15009, "direction": "Inbound", "color": "red", "info": "Vehicle: 15009, Route: 37807, Direction: Inbound"}, {"lat": 49.27841567993164, "lng": -122.91242980957031, "route": "37807", "vehicle": 19044, "direction": "Inbound", "color": "green", "info": "Vehicle: 19044, Route: 37807, Direction: Inbound"}, {"lat": 49.285465240478516, "lng": -123.11396789550781, "route": "37807", "vehicle": 24009, "direction": "Outbound", "color": "green", "info": "Vehicle: 24009, Route: 37807, Direction: Outbound"}, {"lat": 49.28428268432617, "lng": -123.11750030517578, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.284515380859375, "lng": -123.1177978515625, "route": "37807", "vehicle": 24004, "direction": "Inbound", "color": "green", "info": "Vehicle: 24004, Route: 37807, Direction: Inbound"}, {"lat": 49.28609848022461, "lng": -123.11848449707031, "route": "37807", "vehicle": 19014, "direction": "Outbound", "color": "green", "info": "Vehicle: 19014, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.281060457229614, lng: -123.02549600601196 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

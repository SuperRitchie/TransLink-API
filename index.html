
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28126525878906, "lng": -123.09288024902344, "route": "37807", "vehicle": 16201, "direction": "Inbound", "color": "red", "info": "Vehicle: 16201, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.0849838256836, "route": "37807", "vehicle": 19015, "direction": "Inbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.0672836303711, "route": "37807", "vehicle": 23015, "direction": "Inbound", "color": "green", "info": "Vehicle: 23015, Route: 37807, Direction: Inbound"}, {"lat": 49.28125, "lng": -123.03275299072266, "route": "37807", "vehicle": 19027, "direction": "Inbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.02043151855469, "route": "37807", "vehicle": 16203, "direction": "Outbound", "color": "red", "info": "Vehicle: 16203, Route: 37807, Direction: Outbound"}, {"lat": 49.280982971191406, "lng": -123.01441955566406, "route": "37807", "vehicle": 19025, "direction": "Outbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Outbound"}, {"lat": 49.28026580810547, "lng": -122.989501953125, "route": "37807", "vehicle": 22014, "direction": "Outbound", "color": "green", "info": "Vehicle: 22014, Route: 37807, Direction: Outbound"}, {"lat": 49.2735481262207, "lng": -122.9260025024414, "route": "37807", "vehicle": 22005, "direction": "Outbound", "color": "green", "info": "Vehicle: 22005, Route: 37807, Direction: Outbound"}, {"lat": 49.273799896240234, "lng": -122.93099975585938, "route": "37807", "vehicle": 8148, "direction": "Inbound", "color": "red", "info": "Vehicle: 8148, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -122.99683380126953, "route": "37807", "vehicle": 16225, "direction": "Inbound", "color": "red", "info": "Vehicle: 16225, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.09086608886719, "route": "37807", "vehicle": 22004, "direction": "Outbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Outbound"}, {"lat": 49.281166076660156, "lng": -123.07091522216797, "route": "37807", "vehicle": 22007, "direction": "Outbound", "color": "green", "info": "Vehicle: 22007, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.02964782714844, "route": "37807", "vehicle": 19008, "direction": "Inbound", "color": "green", "info": "Vehicle: 19008, Route: 37807, Direction: Inbound"}, {"lat": 49.27906799316406, "lng": -122.91107940673828, "route": "37807", "vehicle": 22006, "direction": "Inbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.28056716918945, "lng": -122.95894622802734, "route": "37807", "vehicle": 16221, "direction": "Inbound", "color": "red", "info": "Vehicle: 16221, Route: 37807, Direction: Inbound"}, {"lat": 49.28413391113281, "lng": -123.11212921142578, "route": "37807", "vehicle": 19029, "direction": "Outbound", "color": "green", "info": "Vehicle: 19029, Route: 37807, Direction: Outbound"}, {"lat": 49.28525161743164, "lng": -123.11361694335938, "route": "37807", "vehicle": 22003, "direction": "Inbound", "color": "green", "info": "Vehicle: 22003, Route: 37807, Direction: Inbound"}, {"lat": 49.27233123779297, "lng": -123.02108001708984, "route": "37807", "vehicle": 19009, "direction": "Inbound", "color": "green", "info": "Vehicle: 19009, Route: 37807, Direction: Inbound"}, {"lat": 49.285884857177734, "lng": -123.11473083496094, "route": "37807", "vehicle": 23001, "direction": "Inbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Inbound"}, {"lat": 49.28596878051758, "lng": -123.11840057373047, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28120040893555, "lng": -123.04573059082031, "route": "37807", "vehicle": 8151, "direction": "Inbound", "color": "red", "info": "Vehicle: 8151, Route: 37807, Direction: Inbound"}, {"lat": 49.28108215332031, "lng": -123.04521942138672, "route": "37807", "vehicle": 19032, "direction": "Outbound", "color": "green", "info": "Vehicle: 19032, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28056733504586, lng: -123.03048706054688 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28141784667969, "lng": -123.1025161743164, "route": "37807", "vehicle": 23011, "direction": "Inbound", "color": "green", "info": "Vehicle: 23011, Route: 37807, Direction: Inbound"}, {"lat": 49.28126525878906, "lng": -123.06623077392578, "route": "37807", "vehicle": 8148, "direction": "Inbound", "color": "red", "info": "Vehicle: 8148, Route: 37807, Direction: Inbound"}, {"lat": 49.2811164855957, "lng": -123.04862976074219, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.04474639892578, "route": "37807", "vehicle": 24009, "direction": "Inbound", "color": "green", "info": "Vehicle: 24009, Route: 37807, Direction: Inbound"}, {"lat": 49.280967712402344, "lng": -123.00211334228516, "route": "37807", "vehicle": 16222, "direction": "Outbound", "color": "red", "info": "Vehicle: 16222, Route: 37807, Direction: Outbound"}, {"lat": 49.273799896240234, "lng": -122.93132019042969, "route": "37807", "vehicle": 22004, "direction": "Outbound", "color": "green", "info": "Vehicle: 22004, Route: 37807, Direction: Outbound"}, {"lat": 49.27545166015625, "lng": -122.9417495727539, "route": "37807", "vehicle": 22009, "direction": "Inbound", "color": "green", "info": "Vehicle: 22009, Route: 37807, Direction: Inbound"}, {"lat": 49.280433654785156, "lng": -122.98141479492188, "route": "37807", "vehicle": 24014, "direction": "Inbound", "color": "green", "info": "Vehicle: 24014, Route: 37807, Direction: Inbound"}, {"lat": 49.28128433227539, "lng": -123.10061645507812, "route": "37807", "vehicle": 22011, "direction": "Outbound", "color": "green", "info": "Vehicle: 22011, Route: 37807, Direction: Outbound"}, {"lat": 49.281131744384766, "lng": -123.0631332397461, "route": "37807", "vehicle": 23001, "direction": "Outbound", "color": "green", "info": "Vehicle: 23001, Route: 37807, Direction: Outbound"}, {"lat": 49.28129959106445, "lng": -123.03116607666016, "route": "37807", "vehicle": 24002, "direction": "Inbound", "color": "green", "info": "Vehicle: 24002, Route: 37807, Direction: Inbound"}, {"lat": 49.279083251953125, "lng": -122.91224670410156, "route": "37807", "vehicle": 23007, "direction": "Inbound", "color": "green", "info": "Vehicle: 23007, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 22002, "direction": "Inbound", "color": "green", "info": "Vehicle: 22002, Route: 37807, Direction: Inbound"}, {"lat": 49.278350830078125, "lng": -122.92066955566406, "route": "37807", "vehicle": 16220, "direction": "Inbound", "color": "red", "info": "Vehicle: 16220, Route: 37807, Direction: Inbound"}, {"lat": 49.284400939941406, "lng": -123.11699676513672, "route": "37807", "vehicle": 19045, "direction": "Inbound", "color": "green", "info": "Vehicle: 19045, Route: 37807, Direction: Inbound"}, {"lat": 49.286598205566406, "lng": -123.11830139160156, "route": "37807", "vehicle": 23004, "direction": "Outbound", "color": "green", "info": "Vehicle: 23004, Route: 37807, Direction: Outbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28039598464966, lng: -123.01841259002686 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>

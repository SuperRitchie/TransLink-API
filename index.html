
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransLink bus map</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100dvh;
    }

    .bus-label {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #333;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      transform: translateY(-6px);
      user-select: none;
    }

    .bus-label.green {
      border-color: #188038;
    }

    .bus-label.red {
      border-color: #d93025;
    }

    .bus-route {
      font-weight: 700;
    }

    .bus-details {
      font-size: 10px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bus-label {
        font-size: 11px;
        padding: 4px 6px;
      }

      .bus-details {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    const buses = [{"lat": 49.28139877319336, "lng": -123.10179901123047, "route": "37807", "vehicle": 22005, "direction": "Inbound", "color": "green", "info": "Vehicle: 22005, Route: 37807, Direction: Inbound"}, {"lat": 49.28120040893555, "lng": -123.08985137939453, "route": "37807", "vehicle": 19027, "direction": "Inbound", "color": "green", "info": "Vehicle: 19027, Route: 37807, Direction: Inbound"}, {"lat": 49.28103256225586, "lng": -123.04443359375, "route": "37807", "vehicle": 19010, "direction": "Outbound", "color": "green", "info": "Vehicle: 19010, Route: 37807, Direction: Outbound"}, {"lat": 49.28106689453125, "lng": -123.02938079833984, "route": "37807", "vehicle": 9753, "direction": "Outbound", "color": "red", "info": "Vehicle: 9753, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.03203582763672, "route": "37807", "vehicle": 19028, "direction": "Outbound", "color": "green", "info": "Vehicle: 19028, Route: 37807, Direction: Outbound"}, {"lat": 49.28121566772461, "lng": -123.05394744873047, "route": "37807", "vehicle": 19039, "direction": "Inbound", "color": "green", "info": "Vehicle: 19039, Route: 37807, Direction: Inbound"}, {"lat": 49.2802848815918, "lng": -122.97955322265625, "route": "37807", "vehicle": 24005, "direction": "Outbound", "color": "green", "info": "Vehicle: 24005, Route: 37807, Direction: Outbound"}, {"lat": 49.273868560791016, "lng": -122.93346405029297, "route": "37807", "vehicle": 22006, "direction": "Inbound", "color": "green", "info": "Vehicle: 22006, Route: 37807, Direction: Inbound"}, {"lat": 49.28044891357422, "lng": -122.97098541259766, "route": "37807", "vehicle": 19025, "direction": "Inbound", "color": "green", "info": "Vehicle: 19025, Route: 37807, Direction: Inbound"}, {"lat": 49.278568267822266, "lng": -122.91238403320312, "route": "37807", "vehicle": 23011, "direction": "Inbound", "color": "green", "info": "Vehicle: 23011, Route: 37807, Direction: Inbound"}, {"lat": 49.27851867675781, "lng": -122.91275024414062, "route": "37807", "vehicle": 19015, "direction": "Inbound", "color": "green", "info": "Vehicle: 19015, Route: 37807, Direction: Inbound"}, {"lat": 49.285316467285156, "lng": -123.11389923095703, "route": "37807", "vehicle": 19016, "direction": "Outbound", "color": "green", "info": "Vehicle: 19016, Route: 37807, Direction: Outbound"}, {"lat": 49.28461837768555, "lng": -123.11270141601562, "route": "37807", "vehicle": 19042, "direction": "Inbound", "color": "green", "info": "Vehicle: 19042, Route: 37807, Direction: Inbound"}, {"lat": 49.286067962646484, "lng": -123.11823272705078, "route": "37807", "vehicle": 9720, "direction": "Outbound", "color": "red", "info": "Vehicle: 9720, Route: 37807, Direction: Outbound"}, {"lat": 49.28703308105469, "lng": -123.11641693115234, "route": "37807", "vehicle": 22003, "direction": "Outbound", "color": "green", "info": "Vehicle: 22003, Route: 37807, Direction: Outbound"}, {"lat": 49.28615188598633, "lng": -123.1185302734375, "route": "37807", "vehicle": 22013, "direction": "Outbound", "color": "green", "info": "Vehicle: 22013, Route: 37807, Direction: Outbound"}, {"lat": 49.28108215332031, "lng": -123.0106201171875, "route": "37807", "vehicle": 19030, "direction": "Inbound", "color": "green", "info": "Vehicle: 19030, Route: 37807, Direction: Inbound"}];

    async function initMap() {
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 49.28170327579274, lng: -123.03829327751609 },
        zoom: 12,
        mapId: "DEMO_MAP_ID",
        gestureHandling: "cooperative",
        minZoom: 10,
        maxZoom: 17,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        clickableIcons: false,
        restriction: {
          latLngBounds: {
            north: 49.55,
            south: 48.95,
            west: -123.35,
            east: -122.40
          },
          strictBounds: false
        }
      });

      const bounds = new google.maps.LatLngBounds();

      buses.forEach((bus) => {
        const label = document.createElement("div");
        label.className = `bus-label ${bus.color}`;

        const route = document.createElement("div");
        route.className = "bus-route";
        route.textContent = `Route ${bus.route}`;

        const details = document.createElement("div");
        details.className = "bus-details";
        details.textContent = `#${bus.vehicle} ${bus.direction}`;

        label.append(route, details);

        const position = { lat: bus.lat, lng: bus.lng };
        bounds.extend(position);

        new AdvancedMarkerElement({
          map,
          position,
          title: bus.info,
          content: label,
          collisionBehavior: google.maps.CollisionBehavior.OPTIONAL_AND_HIDES_LOWER_PRIORITY
        });
      });

      if (buses.length > 0) {
        map.fitBounds(bounds, 60);
      }
    }

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpM_T54nuMm4NSjHV2WR2NL33iFxtu7T8&callback=initMap&v=weekly"
    defer>
  </script>
</body>
</html>
